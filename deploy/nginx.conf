# Beyond Horizons —— 由 deploy/install.sh 填好端口和目录后装进 nginx（和服务器上原有的网站互不影响）
server {
    listen __PORT__;
    listen [::]:__PORT__;
    server_name _;
    root __ROOT__;
    index index.html;
    charset utf-8;

    # 地图瓦片、3D 模型都是 JSON：优先发预先压缩好的 .gz，没有的再现场压缩
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/javascript text/css image/svg+xml text/plain;

    # 不对外：git 仓库和部署脚本
    location ~ /\.git { return 404; }
    location ^~ /deploy/ { return 404; }

    # 页面本身每次都向服务器确认一下（没变就是 304，几乎不耗流量），更新后访客马上能看到
    location = /index.html { add_header Cache-Control "no-cache"; }
    # 第三方库不会变：缓存 30 天
    location ^~ /vendor/ { add_header Cache-Control "public, max-age=2592000"; }
    # 地图、照片、音乐：缓存 1 天，回访的人几乎不用再下载
    location ~ ^/(tilepack|bridgepack|map|photos|music|icons|pet)/ { add_header Cache-Control "public, max-age=86400"; }

    # 和榕忆聊天：转给本机的聊天服务（deploy/pet_api.py，由 deploy/pet-setup.sh 装好；没装时这里返回 502，网页会用离线回答）
    location ^~ /api/pet { proxy_pass http://127.0.0.1:8787; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_read_timeout 45s; client_max_body_size 32k; }

    location / { try_files $uri $uri/ =404; }
}
