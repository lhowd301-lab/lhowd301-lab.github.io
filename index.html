      intro: '沿江西路和长堤大马路交汇的三角地上，1937 年落成，是广州第一座钢框架结构的高层建筑，“广州第一高楼”的名头一直保持到 1967 年。设计借鉴纽约伍尔沃斯大楼的新哥特式手法：窄窗上下对齐成一条条竖线，首层沿街是骑楼，西端是圆弧形的“船头”；12 层以上是层层收进的塔楼，顶上是褐色的五棱台屋顶和五个白色小尖塔。1993 年列为广州市文物保护单位。',
      thoughts: '写下你对爱群大厦的理解。', sample: true },
    { id: 'l44', city: 'gz', meta: '1967', name: '人民桥', en: 'Renmin Bridge', lnglat: [113.24513, 23.10838], zoom: 16.2, pitch: 58,
      facts: { 通车: '1967 年', 结构: '梁桥', 全长: '701.2 m' },
      intro: '北接六二三路和康王南路、南通海珠区的跨江大桥，1965 年动工，1967 年 5 月 1 日通车。原本外观朴素，2018 年的历史文化环境艺术提升工程给它换上了欧陆风格：四角各建一座欧式桥头堡，橘红色的圆顶被街坊叫作“洋葱头”，西侧两岸的桥头堡里装了垂直电梯；桥栏用白色大理石包起来、刻着木棉花，路灯也换成了欧式铁艺灯。',
      thoughts: '写下你对人民桥的理解。', sample: true },
    { id: 'l45', city: 'gz', kind: 'new', meta: '1987', name: '天河体育中心', en: 'Tianhe Sports Center', lnglat: [113.31935, 23.14052], zoom: 15.9, pitch: 58,
      facts: { 落成: '1987 年', 设计: '广州市设计院', 场馆: '体育场 · 体育馆 · 游泳馆' },
      intro: '为 1987 年第六届全运会在原天河机场旧址上建的体育中心，全国第一次同时建成体育场、体育馆、游泳馆三大场馆，也是新城市中轴线的一段。体育场的轮廓是马鞍形，两侧看台上盖着白色拱顶，固定座位约 5.3 万；体育馆外观是六边形，屋顶跨度 126 米；游泳馆有比赛池、跳水池各一个。2018 年列入“中国 20 世纪建筑遗产”。',
      thoughts: '写下你对天河体育中心的理解。', sample: true },
    { id: 'l46', city: 'gz', meta: '1950', name: '越秀山体育场', en: 'Yuexiushan Stadium', lnglat: [113.26081, 23.13927], zoom: 16.6, pitch: 58,
      facts: { 启用: '1950 年', 座位: '约 1.8–2 万', 位置: '越秀山南麓 · 应元路' },
      intro: '在越秀山南麓、镇海楼下方的山谷里，前身是观音山足球场；1950 年由时任市长叶剑英号召市民改建，同年 10 月启用。看台依山而建，场地狭长，不合田径比赛的标准，所以主要办足球，被叫作广州乃至南粤足球的“福地”。最近一次为十五运会翻新后，座椅换成了金黄色。',
      thoughts: '写下你对越秀山体育场的理解。', sample: true },
    { id: 'l47', city: 'gz', meta: '200 m', name: '广东电视塔', en: 'Guangdong TV Tower', lnglat: [113.26418, 23.14376], zoom: 15.6, pitch: 66,
      facts: { 高度: '200 m（海拔 246.5 m）', 启用: '1966 年', 结构: '自立式八角形钢塔' },
      intro: '越秀山北峰（盘龙岗）上的电视发射塔，也叫越秀山电视塔。1959 年开建，1966 年 5 月 1 日投入使用，是中国第一座钢结构自立式多功能电视发射塔，1970 年代曾是全国最高的塔。塔身 50.6 米和 98.4 米处各有一个观光平台（“星河座”和“云霄阁”），1986 年起对游客开放，2000 年后取消了观光，现在仍由广东广播电视台用来发射信号。',
      thoughts: '写下你对广东电视塔的理解。', sample: true },
    { id: 'l48', city: 'gz', kind: 'new', meta: '215.8 m', name: '广州电视塔', en: 'Guangzhou TV Tower', lnglat: [113.26312, 23.14724], zoom: 15.6, pitch: 66,
      facts: { 高度: '215.8 m（海拔 250 m）', 启用: '1991 年', 结构: '四边形钢铁塔' },
      intro: '花果山上的广播电视发射塔，和越秀山上的广东电视塔只隔一条环市中路，1991 年 1 月交付使用。塔身是四边形钢铁塔，130 米处建了一圈圆形玻璃幕墙的观光层，但投资方中途撤资，观光层一直闲置。广州台的广播频道现在仍用它播出。',
      thoughts: '写下你对广州电视塔的理解。', sample: true },
    { id: 'l49', city: 'gz', kind: 'new', meta: '1985', name: '花园酒店', en: 'The Garden Hotel', lnglat: [113.28032, 23.13813], zoom: 16.4, pitch: 62,
      facts: { 开业: '1985 年', 高度: '主楼 112 m · 32 层', 设计: '贝聿铭（概念）、司徒惠' },
      intro: '环市东路上，改革开放后第一批引进外资建的高级酒店，1985 年 8 月开业，店名是邓小平题写的。贝聿铭做了概念设计和草图，再由香港建筑师司徒惠主持设计：酒店大楼和花园大厦是两座 Y 字形的高楼；正门的圆拱形雨篷嵌着 1320 块玻璃砖，后花园有假山瀑布。2010 年亚运会时是总部酒店。',
      thoughts: '写下你对花园酒店的理解。', sample: true },
    { id: 'l50', city: 'gz', kind: 'new', meta: '2008', name: '广东科学中心', en: 'Guangdong Science Center', lnglat: [113.35715, 23.04184], zoom: 16.2, pitch: 62,
      facts: { 开馆: '2008 年 9 月', 占地: '45 万 m²', 建筑面积: '13.75 万 m²' },
      intro: '大学城小谷围岛西端的科技馆，2008 年 9 月开馆，设计方案出自中南设计院。从空中俯看像一朵盛开的木棉花，从湖对岸远看又像一艘扬帆的航母：几片花瓣一样的展馆伸进人工湖，中间是一节节叠起来的拱形玻璃壳，东边入口罩着一大片白色曲面屋顶，檐下嵌着一个仿地球的球面玻璃幕墙。占地 45 万平方米，建筑面积 13.75 万平方米，四周是约 8 万平方米的人工湖。',
      thoughts: '写下你对广东科学中心的理解。', sample: true },
    { id: 'l51', city: 'gz', kind: 'new', meta: '2010', name: '广州南站', en: 'Guangzhou South Railway Station', lnglat: [113.26417, 22.99127], zoom: 15.8, pitch: 60,
      facts: { 启用: '2010 年', 设计: 'TFP Farrells 等', 规模: '15 台 28 线' },
      intro: '番禺石壁的高铁站，武广、广深港、贵广、南广等高铁都在这里汇合，是华南最大的铁路客运枢纽之一，2010 年启用。屋顶由英国 TFP Farrells 等设计，一列列浅拱形的屋面像层层叠起的芭蕉叶，顺着铁轨铺开；候车大厅正中横着一条长 348 米的网格天窗，像叶脉一样。',
      thoughts: '写下你对广州南站的理解。', sample: true },
    { id: 'l52', city: 'gz', kind: 'new', meta: '1974', name: '广州火车站', en: 'Guangzhou Railway Station', lnglat: [113.25255, 23.15110], zoom: 16.4, pitch: 62,
      facts: { 落成: '1974 年 4 月 10 日', 站名题字: '郭沫若' },
      intro: '流花地区的广州站，1974 年 4 月 10 日落成，站房是一长条四层楼，白色面砖配绿色玻璃窗，正中顶上一面大钟，楼顶红色的“广州站”三个大字是郭沫若题写的（八十年代曾改成繁体，1999 年改回简体），两翼楼顶写着“统一祖国”“振兴中华”。门前是一排白色的膜结构伞棚。',
      thoughts: '写下你对广州火车站的理解。', sample: true },
    { id: 'l53', city: 'gz', kind: 'new', meta: '1996', name: '广州东站', en: 'Guangzhou East Railway Station', lnglat: [113.31930, 23.15230], zoom: 16.4, pitch: 62,
      facts: { 新站房启用: '1996 年', 前身: '天河站' },
      intro: '天河林和的广州东站，前身是天河站，1996 年新站房启用后改名，广九直通车也改从这里始发终到。两座方形大厅骑在铁轨上，站房正对天河的城市中轴线：往南是东站广场、中信广场，一直望到天河体育中心和珠江新城。广场北端的曲面玻璃天幕是后来改造时加的，由华南理工大学建筑设计研究院设计。',
      thoughts: '写下你对广州东站的理解。', sample: true },
    { id: 'l54', city: 'gz', kind: 'new', meta: '2004', name: '广州白云国际机场', en: 'Guangzhou Baiyun International Airport', lnglat: [113.30638, 23.38089], zoom: 13.9, pitch: 58,
      facts: { T1启用: '2004 年 8 月', T2启用: '2018 年 4 月', T3启用: '2025 年 10 月 30 日', 跑道: '5 条' },
      intro: '广州的空港，在白云区人和镇和花都区之间。2004 年 8 月旧白云机场整体搬到这里，T1 航站楼启用：主楼夹在东西两条长长的连接楼之间，连接楼伸出一条条指廊。2018 年北边的 T2 启用，主楼正对着 T1，两侧的长臂一路向南和 T1 接上。2025 年 10 月 30 日，东南边的 T3 和第五条跑道一起投运，机场从此有“五条跑道、三座航站楼”。T3 的造型叫“羊城花冠”：中间大厅向四面伸出四条弯成花瓣的指廊，约 31 万平方米的金属屋面用白色的连续着色不锈钢，像云朵也像花瓣；大厅由三排“花冠柱”撑起，玻璃穹顶做成花蕾的样子，值机大厅里还有一座可以俯看整个机场的观景瞭望塔。',
      thoughts: '写下你对白云机场的理解。', sample: true },
    // 香港 · 维港两岸（建模见 buildHK*）
    { id: 'l55', city: 'hk', kind: 'new', meta: '2003', name: '国际金融中心', en: 'International Finance Centre', lnglat: [114.15928, 22.2853], zoom: 15.3, pitch: 62,
      facts: { 二期: '415.8 米 · 88 层', 一期: '210 米', 设计: '西萨·佩里' },
      intro: '中环海旁的国际金融中心（IFC），由一期、二期两座写字楼、国际金融中心商场和四季酒店组成，压在机场快线香港站上面。二期 2003 年落成，高 415.8 米，是当时香港最高的楼，直到 2010 年被对岸的环球贸易广场超过。塔身方形、四角内凹，白色竖条一路拉到顶，越往上越收，最后四角翘起，像一顶皇冠。商场顶上有一片空中花园，正对着维港。',
      thoughts: '写下你对国际金融中心的理解。', sample: true },
    { id: 'l56', city: 'hk', kind: 'new', meta: '1990', name: '中银大厦', en: 'Bank of China Tower', lnglat: [114.16157, 22.27927], zoom: 15.5, pitch: 62,
      facts: { 高度: '367.4 米（含天线）', 落成: '1990 年', 设计: '贝聿铭' },
      intro: '贝聿铭设计的中国银行香港总部，1990 年落成，连两根天线高 367.4 米，是当时亚洲最高的建筑。正方形的平面沿对角线分成四个三角柱，在不同高度斜切收顶，越往上越少，最后只剩一根，取竹子“节节高升”的意思。立面上白色的框勾出一个个巨大的“X”，对应的正是大楼承重的斜撑。',
      thoughts: '写下你对中银大厦的理解。', sample: true },
    { id: 'l57', city: 'hk', kind: 'new', meta: '1992', name: '中环广场', en: 'Central Plaza', lnglat: [114.17364, 22.27996], zoom: 15.5, pitch: 62,
      facts: { 高度: '374 米（含塔尖）', 落成: '1992 年', 层数: '78 层' },
      intro: '名字叫中环，其实在湾仔海旁。1992 年落成，连塔尖高 374 米，落成后取代中银大厦成为亚洲最高的建筑，也是当时世界上最高的钢筋混凝土大楼。平面是切了角的三角形，金色和银色的玻璃一层层相间，顶上是玻璃金字塔和塔尖。入夜后塔顶的霓虹灯带每 15 分钟换一种颜色，懂得看的人能从颜色读出时间。',
      thoughts: '写下你对中环广场的理解。', sample: true },
    { id: 'l58', city: 'hk', kind: 'new', meta: '1985', name: '汇丰总行大厦', en: 'HSBC Main Building', lnglat: [114.15954, 22.28028], zoom: 16, pitch: 60,
      facts: { 高度: '178.8 米', 落成: '1985 年', 设计: '诺曼·福斯特' },
      intro: '皇后大道中 1 号，福斯特设计，1985 年落成。电梯、楼梯这些服务核心被挪到两侧，8 根钢柱和 5 层“衣架”一样的悬挂桁架把一层层楼板吊起来，所以地面一层完全架空，成了行人可以穿过的广场，抬头还能望进十层高的中庭。门前那对铜狮比大楼还老，叫“史提芬”和“施迪”。',
      thoughts: '写下你对汇丰总行大厦的理解。', sample: true },
    { id: 'l59', city: 'hk', kind: 'new', meta: '1999', name: '长江集团中心', en: 'Cheung Kong Center', lnglat: [114.16056, 22.27952], zoom: 15.7, pitch: 62,
      facts: { 高度: '283 米', 落成: '1999 年', 设计: '西萨·佩里' },
      intro: '夹在中银大厦和汇丰总行之间，1999 年落成，高 283 米，原址是希尔顿酒店。设计国际金融中心的西萨·佩里也设计了它：方方正正的玻璃盒子外面罩一层不锈钢方格，在两位造型张扬的邻居中间显得很克制。入夜后外墙的方格会亮起灯来。',
      thoughts: '写下你对长江集团中心的理解。', sample: true },
    { id: 'l60', city: 'hk', kind: 'new', meta: '1988', name: '力宝中心', en: 'Lippo Centre', lnglat: [114.16351, 22.27937], zoom: 16, pitch: 60,
      facts: { 高度: '172 米 · 186 米', 落成: '1988 年', 设计: '保罗·鲁道夫' },
      intro: '金钟的力宝中心，美国建筑师保罗·鲁道夫设计，1988 年落成，原名奔达中心，由澳洲商人邦德兴建，后来转手才改了名。两座八角形的塔楼一高一矮，深色玻璃的凸窗一簇簇向外伸出，远看像几只树熊抱着树干往上爬，所以有“树熊抱树”的外号。',
      thoughts: '写下你对力宝中心的理解。', sample: true },
    { id: 'l61', city: 'hk', kind: 'new', meta: '1973', name: '怡和大厦', en: 'Jardine House', lnglat: [114.15915, 22.283], zoom: 16, pitch: 60,
      facts: { 高度: '178.5 米', 落成: '1973 年', 原名: '康乐大厦' },
      intro: '中环的怡和大厦，1973 年落成，原名康乐大厦，是当时香港最高的楼。外墙开了一千七百多个圆窗，外号“千孔大厦”。它落成时就站在海边，后来中环一次次填海，前面才长出了交易广场和国际金融中心。',
      thoughts: '写下你对怡和大厦的理解。', sample: true },
    { id: 'l62', city: 'hk', kind: 'new', meta: '1980', name: '合和中心', en: 'Hopewell Centre', lnglat: [114.17159, 22.27467], zoom: 16, pitch: 60,
      facts: { 高度: '216 米 · 64 层', 落成: '1980 年', 发展商: '胡应湘（合和实业）' },
      intro: '湾仔皇后大道东的合和中心，1980 年落成，64 层、高 216 米，圆柱形的塔楼当了将近十年香港最高的楼，直到中银大厦出现。白色横带夹着一圈圈深色玻璃，外墙挂着观光电梯，顶层是会转的旋转餐厅。大楼建在山坡上，后门在 17 楼，直通半山的坚尼地道。',
      thoughts: '写下你对合和中心的理解。', sample: true },
    { id: 'l63', city: 'hk', kind: 'new', meta: '1997', name: '香港会议展览中心', en: 'Hong Kong Convention and Exhibition Centre', lnglat: [114.173, 22.28337], zoom: 15.8, pitch: 55,
      facts: { 新翼落成: '1997 年', 交接仪式: '1997 年 7 月 1 日零时' },
      intro: '湾仔海旁的会展中心新翼，1997 年建在填海出来的人工岛上，铝板屋顶一层叠一层，像展开翅膀的海鸟。1997 年 6 月 30 日深夜到 7 月 1 日零时，香港回归的交接仪式就在新翼的大会堂举行。门前的金紫荆广场立着金紫荆雕塑和回归纪念碑。',
      thoughts: '写下你对会展中心的理解。', sample: true },
    { id: 'l64', city: 'hk', kind: 'new', meta: '2014', name: '香港摩天轮', en: 'Hong Kong Observation Wheel', lnglat: [114.16177, 22.28533], zoom: 16.6, pitch: 55,
      facts: { 高度: '60 米', 启用: '2014 年 12 月', 车厢: '42 个' },
      intro: '中环海滨长廊上的摩天轮，2014 年 12 月启用，高 60 米，挂着 42 个车厢。转到最高处，对岸尖沙咀、西九龙的天际线和整片维港就在眼前；晚上轮圈亮起灯，是中环海边新的地标。',
      thoughts: '写下你对香港摩天轮的理解。', sample: true },
    { id: 'l65', city: 'hk', kind: 'new', meta: '2010', name: '环球贸易广场', en: 'International Commerce Centre', lnglat: [114.16023, 22.30338], zoom: 15.1, pitch: 62,
      facts: { 高度: '484 米 · 118 层', 落成: '2010 年', 设计: 'KPF' },
      intro: '西九龙的环球贸易广场（ICC），2010 年落成，118 层、高 484 米，是香港最高的楼。脚下是机场快线九龙站和圆方商场；100 楼是观景台“天际 100”，最高的十几层是丽思卡尔顿酒店。玻璃幕墙四角内凹、底部微微外撇；外墙装满了 LED，夜里会上演灯光汇演。',
      thoughts: '写下你对环球贸易广场的理解。', sample: true },
    { id: 'l66', city: 'hk', kind: 'new', meta: '1989', name: '香港文化中心', en: 'Hong Kong Cultural Centre', lnglat: [114.17034, 22.29381], zoom: 16.2, pitch: 55,
      facts: { 开幕: '1989 年', 场馆: '音乐厅 · 大剧院 · 剧场' },
      intro: '尖沙咀海旁的香港文化中心，1989 年开幕，建在旧九广铁路尖沙咀总站的原址上，里面有音乐厅、大剧院和剧场。外墙贴着粉红色瓷砖、几乎不开窗，弧形的屋顶一路斜落，当年因为“背对维港”惹过不少争议。门前的海滨长廊是看对岸港岛夜景的好位置。',
      thoughts: '写下你对香港文化中心的理解。', sample: true },
    { id: 'l67', city: 'hk', kind: 'new', meta: '1980', name: '香港太空馆', en: 'Hong Kong Space Museum', lnglat: [114.17202, 22.29426], zoom: 16.6, pitch: 55,

    { id: 'l68', city: 'hk', kind: 'new', meta: '2021', name: 'M+ 博物馆', en: 'M+', lnglat: [114.15916, 22.30083], zoom: 16.2, pitch: 58,
      facts: { 开馆: '2021 年 11 月', 设计: '赫尔佐格和德梅隆', 位置: '西九文化区' },
      intro: '西九文化区的 M+，以视觉文化为主题的博物馆，2021 年 11 月开馆，由赫尔佐格和德梅隆设计。建筑像一个倒转的“T”：横向的展厅基座上立着一块薄薄的板楼，外面挂着深绿色的陶砖。朝维港的一面是一整块 LED 幕墙，晚上播放艺术家的影像作品，隔着海从港岛也看得见。',

    { id: 'l69', city: 'hk', kind: 'new', meta: '2022', name: '香港故宫文化博物馆', en: 'Hong Kong Palace Museum', lnglat: [114.15546, 22.30151], zoom: 16.2, pitch: 58,

function photoArt(seed, label, w = 480, h = 360) {

// 国际金融中心 (二期 415.8 m · 一期 210 m · 商场)：方形平面四角内收，银灰玻璃上粗白竖线，往上几次退台，顶上四角竖起“爪”
function buildHKIFC(THREE, K) {
  const g = new THREE.Group(), add = (geo, m) => g.add(K.mesh(geo, m));
  const glass = K.mat({ bg: '#93a8bf', v: 7, vc: '#f1f5f9', vw: 5, h: 2, hc: '#b4c3d3', hw: 1 }, {}, 0.6), roof = K.mat(0xdfe5ec);
  const crown = (r, z0, z1, m) => {   // four fins at the corners of the top setback, sloping down towards the middle
    const c = K.centroid(r), a = hkAxis(r), loc = hkLocal(r, c, a);
    for (const [sx, sy] of [[1, 1], [-1, 1], [-1, -1], [1, -1]]) {
      let best = loc[0]; for (const p of loc) if (p[0] * sx + p[1] * sy > best[0] * sx + best[1] * sy) best = p;
      const u = [-sx, -sy].map((v) => v / Math.SQRT2), w = [-u[1], u[0]], L = Math.hypot(best[0], best[1]) * 0.42, t = 2.2;
      const P = (d, e) => hkWorld([best[0] + u[0] * d + w[0] * e, best[1] + u[1] * d + w[1] * e], c, a);
      const base = [P(0, -t), P(0, t), P(L, t), P(L, -t)];
      add(K.loft([K.at(base, z0), base.map((p, i) => [p[0], p[1], i < 2 ? z1 : z1 - (z1 - z0) * 0.55])]), m);
      add(K.cap(base.map((p, i) => [p[0], p[1], i < 2 ? z1 : z1 - (z1 - z0) * 0.55])), m);
    }

  const r2 = K.ccw(HK_FP.ifc2), r1 = K.ccw(HK_FP.ifc1);
  hkStack(K, add, r2, [[0, 1], [262, 0.975], [318, 0.945], [356, 0.9], [384, 0.85], [398]], glass, roof);
  crown(K.scale(r2, K.centroid(r2), 0.85), 398, 415.8, K.mat(0xeef2f6, {}, 0.6));
  hkStack(K, add, r1, [[0, 1], [168, 0.95], [190, 0.88], [200]], glass, roof);
  crown(K.scale(r1, K.centroid(r1), 0.88), 200, 210, K.mat(0xeef2f6, {}, 0.6));
  // the mall and the roof garden on it
  const mall = K.ccw(HK_FP.ifcmall);
  add(K.loft([K.at(mall, 0), K.at(mall, 24)], { tw: 14, th: 12 }), K.mat({ bg: '#cfd6de', h: 4, hc: '#aab6c3', hw: 3, v: 10, vc: '#e3e8ee', vw: 2 }));
  add(K.cap(K.at(mall, 24)), K.mat(0xbfcdb8));
  return g;
}

  const wall = K.mat({ bg: '#506a86', v: 8, vc: '#6f8aa6', vw: 2, h: 13, hc: '#61799a', hw: 1 }, {}, 0.6);

  const segs = [], R = 0.85;
  for (let i = 0; i < 4; i++) {
    const A = sq[i], B = sq[(i + 1) % 4], tri = [A, B, O], hi = PEAK[i], lo = hi - RISE;
    const top = tri.map((p, k) => [p[0], p[1], k < 2 ? lo : hi]);
    add(K.loft([K.at(tri, 0), top], { tw: 10, th: 8 }), wall);
    add(K.cap(top), slope);
    // the X braces on the outer face, one per square module
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    for (let z = 0; z < lo - 1; z += L) {
      const z1 = Math.min(z + L, lo), f = (z1 - z) / L;
      const M = (t, zz) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t, zz];
      segs.push([M(0, z), M(f, z1), R], [M(1, z), M(1 - f, z1), R], [M(0, z), M(1, z), R]);
    }
    segs.push([[A[0], A[1], lo], [B[0], B[1], lo], R], [[A[0], A[1], lo], [O[0], O[1], hi], R], [[B[0], B[1], lo], [O[0], O[1], hi], R]);
    segs.push([[A[0], A[1], 0], [A[0], A[1], lo], R * 1.3]);
  }
  segs.push([[O[0], O[1], 0], [O[0], O[1], PEAK[3]], R]);
  g.add(K.rods(segs, K.mat(0xf4f6f8, {}, 1.0), 6));

  const A = sq[3], B = sq[0], mid = [(A[0] + B[0]) / 2, (A[1] + B[1]) / 2];

  g.add(K.rods([[[O[0], O[1], PEAK[3]], [O[0], O[1], 367.4], 0.7], [[m1[0], m1[1], PEAK[3] - 8], [m1[0], m1[1], 360], 0.6]], K.mat(0xe8ecf0, {}, 0.8), 6));
  return g;
}

// 汇丰总行大厦 (178.8 m)：福斯特的“衣架”结构，三段高度不一的楼板挂在八根钢柱和五层桁架上，底层架空成广场
function buildHKHSBC(THREE, K) {
  const g = new THREE.Group(), add = (geo, m) => g.add(K.mesh(geo, m));
  const r = K.ccw(HK_FP.hsbc), c = K.centroid(r), a = hkAxisEW(r), loc = hkLocal(r, c, a);
  const xs = loc.map((p) => p[0]), ys = loc.map((p) => p[1]), x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const glass = K.mat({ bg: '#94a1ae', v: 14, vc: '#d3d9df', vw: 2, h: 7, hc: '#aeb8c2', hw: 1 }, {}, 0.6), roof = K.mat(0xc9d0d8);
  const steel = K.mat(0x8c969f, {}, 0.35), segs = [];
  const H = [140, 178.8, 160], W = (x1 - x0) / 3;
  for (let b = 0; b < 3; b++) {
    const bx0 = x0 + b * W, bx1 = bx0 + W, q = [[bx0, y0], [bx1, y0], [bx1, y1], [bx0, y1]].map((p) => hkWorld(p, c, a));
    add(K.loft([K.at(q, 12), K.at(q, H[b])], { tw: 6, th: 4.2 }), glass);
    add(K.cap(K.at(q, H[b])), roof);
    add(K.cap(K.at(q, 12), true), roof);
  }
  // masts (pairs of columns) at the bay edges, on both long faces, down to the street
  const zs = [36, 72, 108, 140, 172];
  for (let b = 0; b <= 3; b++) {
    const x = x0 + b * W, h = Math.max(H[Math.min(b, 2)], H[Math.max(b - 1, 0)]);
    for (const y of [y0 - 1.5, y1 + 1.5]) for (const dx of [-2, 2]) segs.push([[...hkWorld([x + dx, y], c, a), 0], [...hkWorld([x + dx, y], c, a), h + 4], 0.9]);
  }
  // the coat-hanger trusses
  for (let b = 0; b < 3; b++) for (const z of zs) {
    if (z > H[b] - 4) continue;
    const xa = x0 + b * W, xb = xa + W, xm = (xa + xb) / 2;
    for (const y of [y0 - 1.5, y1 + 1.5]) {
      const P = (x, zz) => [...hkWorld([x, y], c, a), zz];
      segs.push([P(xa, z), P(xb, z), 0.7], [P(xa, z + 9), P(xm, z), 0.6], [P(xb, z + 9), P(xm, z), 0.6], [P(xa, z + 9), P(xb, z + 9), 0.6]);
    }
  }
  g.add(K.rods(segs, steel, 6));
  return g;
}

// 香港摩天轮 (60 m)：中环海滨，42 个车厢

  const P = (t, rad = R, off = 0) => { const p = hkWorld([Math.cos(t) * rad, off], c, a); return [p[0], p[1], ZC + Math.sin(t) * rad]; };
  const rim = [], spokes = [], legs = [];

  for (const o of [-7, 7]) for (const d of [-14, 14]) { const top = P(0, 0, o * 0.25), foot = hkWorld([d, o], c, a); legs.push([[foot[0], foot[1], 0], [top[0], top[1], ZC], 0.8]); }
  const lights = K.mat(0xf2f5f8, {}, 1.0);

// 环球贸易广场 ICC (484 m)：香港最高楼，方形平面四角内凹，底部微微外撇，顶上斜切；
// 100 楼是天际 100 观景台；外墙满布 LED，晚上和“幻彩咏香江”一起变色
function buildHKICC(THREE, K) {
  const g = new THREE.Group(), add = (geo, m) => g.add(K.mesh(geo, m));
  const r = K.ccw(HK_FP.icc), c = K.centroid(r), a = hkAxis(r);
  const glass = K.mat({ bg: '#8aa3bc', v: 9, vc: '#dfe8f1', vw: 3, h: 2, hc: '#a9bccf', hw: 1 }, {}, 0.8);
  const S = [[0, 1.03], [20, 1], [45, 0.955], [80, 0.93], [430, 0.93], [470, 0.86]];
  const rings = S.map(([z, s]) => K.at(K.scale(r, c, s), z));
  add(K.loft(rings, { tw: 9, th: 8 }), glass);
  // the slanted top: highest at one edge
  const top = K.scale(r, c, 0.86), dir = [Math.cos(a), Math.sin(a)], w = Math.max(...top.map((p) => (p[0] - c[0]) * dir[0] + (p[1] - c[1]) * dir[1]));
  const tz = (p) => 470 + 14 * (0.5 + ((p[0] - c[0]) * dir[0] + (p[1] - c[1]) * dir[1]) / (2 * w));
  add(K.loft([K.at(top, 470), top.map((p) => [p[0], p[1], tz(p)])], { tw: 9, th: 8 }), glass);
  add(K.cap(top.map((p) => [p[0], p[1], tz(p)])), K.mat({ bg: '#b6c7d8', v: 6, vc: '#e6edf4', vw: 2 }, {}, 0.6));
  // LED skin for the light show: a thin shell just outside the glass, lit only at night
  // (LED strips down every mullion; a texture 160 m tall with a bright band in it, slid upwards so light runs up the tower)
  const cv = document.createElement('canvas'); cv.width = 64; cv.height = 256; const cg = cv.getContext('2d');
  for (let y = 0; y < 256; y++) { const d = Math.min(Math.abs(y - 128), 256 - Math.abs(y - 128)), a = 0.3 + 0.7 * Math.exp(-((d / 34) ** 2)); cg.fillStyle = `rgba(255,255,255,${a.toFixed(3)})`; for (let x = 0; x < 64; x += 16) cg.fillRect(x, y, 8, 1); }
  const lt = new THREE.CanvasTexture(cv); lt.wrapS = lt.wrapT = THREE.RepeatWrapping;
  const led = new THREE.MeshBasicMaterial({ map: lt, color: 0x66ccff, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending });
  const shell = rings.slice(3).map((q) => K.at(K.scale(q, c, 1.006), q[0][2]));
  add(K.loft(shell, { tw: 6, th: 160 }), led);
  g.userData.night = (n, t) => { led.opacity = n * 0.9; led.visible = n > 0.01; lt.offset.y = -t * 0.12; led.color.setHSL((t * 0.025) % 1, 0.9, 0.62); };
  return g;
}

// M+ 视觉文化博物馆：横向的展厅基座上立一块薄板，深绿色陶片百叶；朝海一面是 LED 幕墙，晚上播放影像

// 广州塔：OSM 建筑数据里没有塔身，这里按公开尺寸生成一个简化的扭转双曲面（底部约 80×60 m，腰部约 30 m，塔身 450 m + 天线 150 m）
function cantonTower() {
  const [lon0, lat0] = [113.31914, 23.10899];
  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110574;
  const ring = (rx, ry, rot) => { const pts = []; for (let i = 0; i <= 28; i++) { const a = (i / 28) * Math.PI * 2; const x = rx * Math.cos(a), y = ry * Math.sin(a); pts.push([lon0 + (x * Math.cos(rot) - y * Math.sin(rot)) / kx, lat0 + (x * Math.sin(rot) + y * Math.cos(rot)) / ky]); } return pts; };
  const F = []; const N = 18;
  for (let k = 0; k < N; k++) {
    const z0 = (k / N) * 450, z1 = ((k + 1) / N) * 450, t = (z0 + z1) / 900;
    const below = t < 0.62; const f = Math.pow(below ? (0.62 - t) / 0.62 : (t - 0.62) / 0.38, 1.4);
    const rx = below ? 15 + 25 * f : 15 + 12 * f, ry = below ? 15 + 15 * f : 15 + 5 * f;
    F.push({ type: 'Feature', properties: { b: z0, h: z1 }, geometry: { type: 'Polygon', coordinates: [ring(rx, ry, (t * 45 * Math.PI) / 180)] } });
  }
  F.push({ type: 'Feature', properties: { b: 450, h: 600 }, geometry: { type: 'Polygon', coordinates: [ring(4.5, 4.5, 0)] } });
  return { type: 'FeatureCollection', features: F };
}

/* ---------- 自动收起：鼠标一段时间不动就收起；碰到上 / 左 / 右边缘时再展开（仅限有鼠标的桌面端） */

// 收起 / 展开左右面板；地图中心随之移到空出来的区域
function applyHud(mode = 'ease') {
  const ui = $('#ui');
  ui.classList.toggle('nav-min', state.navMin); ui.classList.toggle('city-min', state.cityMin);

function setModule(id, opts = {}) {
  if (id === 'sky') { Sky.open(); return; }
  if (id === 'metro') { Metro.go(); return; }
  if (id === 'pet') { Pet.open(); return; }
  state.module = id; state.active = null;
  closeDetail();
  document.querySelectorAll('.nav-btn').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.mod === id)));
  renderCities();
  if (!map || !state.ready) return;

  setTrail(false);
  for (const l of ['lm-park', 'lm-park-line']) if (map.getLayer(l)) map.setLayoutProperty(l, 'visibility', id === 'landmark' ? 'visible' : 'none');
  if (opts.fit !== false) {
    const its = MODULES.find((m) => m.id === id).items().filter((i) => i.lnglat && (id !== 'food' || foodVisible(i)));
    fitItems(its.flatMap((i) => (i.locs ? i.locs.map((l) => l.p) : [i.lnglat])));
  }
}

function flyToItem(item, force) {

  const off = mq.matches ? [0, -Math.round(window.innerHeight * 0.2)] : [-190, 40];
  const lm = SITE.landmarks.includes(item);
  const zoom = lm ? (item.zoom || 16.7) : Math.max(force ? 16.4 : 15.4, Math.min(map.getZoom(), 16.6));
  map.flyTo({ center: item.lnglat, zoom, pitch: state.is3d ? (lm ? item.pitch || 60 : 55) : 0, offset: off, ...(mq.matches ? {} : { padding: hudPadding() }), duration: reduceMotion ? 0 : 1400, essential: true });
}
// 扫街小图：图片加载完再淡入；鼠标移动时轻微倾斜 + 高光；点开全屏
function bindShots(d, item) {
  const tiles = [...d.querySelectorAll('.shot')];
  const hover = !reduceMotion && window.matchMedia('(hover: hover)').matches;
  tiles.forEach((t, k) => {
    const img = t.querySelector('img');
    const ok = () => { t.classList.add('ok'); if (!item.photos[k].ar && img.naturalWidth) t.style.setProperty('--ar', (img.naturalWidth / img.naturalHeight).toFixed(3)); };
    if (img.complete && img.naturalWidth) ok(); else { img.addEventListener('load', ok, { once: true }); img.addEventListener('error', ok, { once: true }); }

    if (!hover) return;
    t.addEventListener('pointermove', (e) => {
      const r = t.getBoundingClientRect(); const x = (e.clientX - r.left) / r.width, y = (e.clientY - r.top) / r.height;

      t.style.setProperty('--gx', `${(x * 100).toFixed(1)}%`); t.style.setProperty('--gy', `${(y * 100).toFixed(1)}%`);
    });
    t.addEventListener('pointerleave', () => { t.style.setProperty('--rx', '0deg'); t.style.setProperty('--ry', '0deg'); });

}
// full-screen photo viewer for 扫街 photos: opens by growing out of the tapped thumbnail and shrinks back into it on close;

const LDAY = ['初一', '初二', '初三', '初四', '初五', '初六', '初七', '初八', '初九', '初十', '十一', '十二', '十三', '十四', '十五', '十六', '十七', '十八', '十九', '二十', '廿一', '廿二', '廿三', '廿四', '廿五', '廿六', '廿七', '廿八', '廿九', '三十'];

function lunar(d) {

    const parts = lunarFmt.formatToParts(d);
    const m = parts.find((p) => p.type === 'month')?.value || '';

}

function wxFromCode(c) {

  if (c === 45 || c === 48) return ['fog', '雾'];

  if (c >= 80) return ['rain', '阵雨'];
  if (c >= 51) return ['rain', '雨'];

}

  $('#wxBig').textContent = `${lo}–${hi}°C`;
  $('#wxSmall').textContent = `广州 · ${m + 1}月常年`;
  $('#wxSeg').title = '实时天气暂不可用，显示的是广州该月的常年平均气温。';
}
async function loadWeather() {
  showClimate();

  try {
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=23.13&longitude=113.26&current=temperature_2m,weather_code&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FShanghai&forecast_days=1', { signal: ctl.signal });

const cal = { y: new Date().getFullYear(), m: new Date().getMonth() };
function moonInfo(d) {
  let phase;
  if (window.Astronomy) { try { phase = Astronomy.MoonPhase(d); } catch (e) { phase = null; } }
  if (phase == null) { const syn = 29.530588853; const ref = Date.UTC(2000, 0, 6, 18, 14); phase = ((((d - ref) / 864e5) % syn + syn) % syn) / syn * 360; }

}

  const lit = `M${c} ${c - r} A${r} ${r} 0 0 ${sweepOuter} ${c} ${c + r} A${rx} ${r} 0 0 ${sweepInner} ${c} ${c - r}Z`;
  return `<svg class="moon-ic" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle cx="${c}" cy="${c}" r="${r}" fill="#1E3A8A"/><path d="${lit}" fill="#FDF6D8"/></svg>`;
}

  },
  up(e) { this.shift = e.shiftKey; this.keys.delete(e.code); },
  stop() { this.keys.clear(); },
  step(now) {
    const dt = Math.min(0.05, (now - this.last) / 1000); this.last = now;
    let ix = 0, iy = 0; for (const k of this.keys) { const m = this.MOVE[k]; if (m) { ix += m[0]; iy += m[1]; } }
    const n = Math.hypot(ix, iy) || 1, fast = this.shift ? 2.6 : 1, ease = 1 - Math.exp(-dt / 0.12);
    this.vx += ((ix / n) * 520 * fast - this.vx) * ease; this.vy += ((iy / n) * 520 * fast - this.vy) * ease;   // screen px per second
    this.turn += (((this.keys.has('KeyE') ? 1 : 0) - (this.keys.has('KeyQ') ? 1 : 0)) * 75 * fast - this.turn) * ease;   // degrees per second
    if (!this.keys.size && Math.hypot(this.vx, this.vy) < 3 && Math.abs(this.turn) < 0.5) { this.vx = this.vy = this.turn = 0; this.raf = 0; return; }

    const right = this.vx * dt * mpp, fwd = this.vy * dt * mpp;

    this.raf = requestAnimationFrame((t) => this.step(t));
  },
};

      : `<div class="pet-homebar"><button class="pet-act primary" type="button" data-act="quest">看线索，去找啵铃</button><button class="pet-act" type="button" data-act="pv-start">试玩：先带它回家看看</button></div><p class="pet-note">现在可以先把家布置起来，抓回来的时候它会更安心。</p>`;

    else if (a === 'quest') this.show('quest', true);

  },
  // ------------------------------------------------------------- for testing (?petdebug)
  advance(hours, away = true) { this.skew += hours * 3600000; this.step(!away); this.save(); this.updateDock(); this.render(); },
};

function makeBolingArt(THREE, imgs, cam) {
  const S_ = PET2D_S;
  const root = new THREE.Group(), bb = new THREE.Group(), turn = new THREE.Group();
  root.add(bb); bb.add(turn);
  if (cam) bb.quaternion.copy(cam.quaternion);
  const tex = {};
  for (const [k, im] of Object.entries(imgs)) { const t = new THREE.Texture(im); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; t.needsUpdate = true; tex[k] = t; }

  // ---------------------------------------------------------------- build one pose: grid mesh + weights
  const sm = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  function sdPoly(poly, x, y) {   // signed distance, negative inside
    let d = 1e9, inside = false;
    for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
      const [xi, yi] = poly[i], [xj, yj] = poly[j];
      if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      const ex = xj - xi, ey = yj - yi, l2 = ex * ex + ey * ey || 1, t = Math.max(0, Math.min(1, ((x - xi) * ex + (y - yi) * ey) / l2));
      d = Math.min(d, Math.hypot(x - xi - t * ex, y - yi - t * ey));
    }
    return inside ? -d : d;
  }
  function buildPose(name, R) {
    const [W, H] = R.size, [ox, oy] = R.o, im = imgs[name], G = 5;
    // which cells have paint (so the empty corners carry no triangles)
    let A = null;
    try { const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const cx = cv.getContext('2d'); cx.drawImage(im, 0, 0, W, H); A = cx.getImageData(0, 0, W, H).data; } catch (e) { /* can't read pixels: mesh the whole picture */ }
    const nx = Math.ceil(W / G) + 1, ny = Math.ceil(H / G) + 1, occ = new Uint8Array((nx - 1) * (ny - 1));
    for (let j = 0; j < ny - 1; j++) for (let i = 0; i < nx - 1; i++) {
      let hit = 0; for (let y = j * G; y < Math.min(H, (j + 1) * G) && !hit; y += 1) for (let x = i * G; x < Math.min(W, (i + 1) * G); x += 1) if (!A || A[(y * W + x) * 4 + 3] > 4) { hit = 1; break; }
      occ[j * (nx - 1) + i] = hit;

    if (k >= 1) this.slide = null;
  },
  fallStep(t) {   // straight down onto the floor, speeding up
    const f = this.fall, k = Math.min(1, Math.max(0, (t - f.t0) / f.dur));
    this.h = f.h0 * (1 - k * k) + (f.h1 || 0) * k * k;
    if (k < 1) return;
    this.fall = null; this.h = f.h1 || 0; this.mode = 'idle';
    this.react('land'); this.fx('dust', 3);
  },
  // ------------------------------------------------------------- picked up and dropped
  grab(e) {
    if (this.mode === 'sleep') this.wake(true);
    this.act = null; this.path = []; this.then = null; this.slide = null; this.faceYaw = null;
    const foot = this.P(this.pos.u, this.pos.v, this.h), p = this.svgXY(e.clientX, e.clientY);
    this.drag = { off: [foot[0] - p[0], foot[1] - p[1] - 20], xy: [foot[0], foot[1] - 20], lift: 70 };
    this.mode = 'drag'; this.who.classList.add('held');
    this.talk(['哇——！', '放我下来啦～', '飞起来咯！'][Math.floor(Math.random() * 3)], 1600);
  },
  drop() {
    const d = this.drag; this.drag = null; this.who.classList.remove('held');
    const uv = this.toUV([d.xy[0], d.xy[1] + d.lift]), g = this.nearFree(uv[0], uv[1]);
    this.pos = { u: g[0], v: g[1] };
    const hb = this.onBed() ? 12 : 0, h0 = Math.max(hb + 10, this.P(g[0], g[1])[1] - d.xy[1]);
    this.h = h0; this.mode = 'fall';
    this.fall = { h0, h1: hb, t0: performance.now(), dur: Math.min(600, 230 + h0 * 2.4) };
  },
  // ------------------------------------------------------------- reactions
  react(name, keepFace) {
    if (!this.present() || !this.shown || this.drag || this.fall) return;
    if (this.mode === 'sleep') { this.wake(true); if (name !== 'pat') return; }
    this.path = []; this.then = null; this.slide = null; this.mode = 'act';
    if (!keepFace) this.faceYaw = null;
    const pick = (a) => a[Math.floor(Math.random() * a.length)];
    this.act = { name, t0: performance.now(), dur: this.DUR[name] || 1 };
    if (name === 'pat') { this.fx('heart', 3); this.talk(pick(['嘿嘿～', '再摸摸！', '好舒服～', '最喜欢你啦！'])); }
    else if (name === 'shy') { this.fx('heart', 2); this.talk('好痒！'); }
    else if (name === 'hop') { this.fx('sparkle', 3); this.talk(pick(['啵！', '跳跳～', '嘿！'])); }
    else if (name === 'roll') {   // a forward somersault, left or right across the floor wherever there's room
      const dirs = Math.random() < 0.5 ? [1, -1] : [-1, 1];
      for (const s of dirs) { const b = [this.pos.u + s * 0.14, this.pos.v + s * 0.14]; if (this.clear([this.pos.u, this.pos.v], b) && this.free(b[0], b[1])) { this.slide = { a: [this.pos.u, this.pos.v], b, t0: performance.now() + 80, dur: 820 }; this.faceYaw = Math.atan2(s, s); this.B && (this.B.S.yaw = this.faceYaw); break; } }
      this.fx('drop', 2); this.talk('咕噜咕噜～');
    } else if (name === 'spin') { this.fx('sparkle', 2); this.talk('转圈圈～'); }
    else if (name === 'shake') { this.fx('drop', 5); this.talk('抖抖～'); }
    else if (name === 'look') this.talk(pick(['嗯？', '那是什么？', '咦～']));
    else if (name === 'eat') { this.fx('sparkle', 3); this.talk('啊呜～好吃！'); }
    else if (name === 'gaze') this.talk(pick(['外面有云！', '风好舒服～', '那朵云像我！']), 2600);
    else if (name === 'sniff') { this.fx('sparkle', 2); this.talk('香香的～'); }
    else if (name === 'lamp') { this.fx('sparkle', 2); this.talk('暖暖的～'); }
    else if (name === 'peek') this.talk('箱子里有什么？');
    else if (name === 'wake') this.talk('嗯…睡醒啦');
  },
  endAct() {
    this.act = null;
    if (this.mode === 'act') { this.mode = 'idle'; this.faceYaw = null; this.nextIdle = performance.now() + 2500 + Math.random() * 4500; }
  },
  nap(onBed) {
    this.act = null; this.path = []; this.mode = 'sleep'; this.faceYaw = null;
    this.wakeAt = performance.now() + 12000 + Math.random() * 10000; this.zzzAt = performance.now() + 900;
    if (onBed) this.talk('呼～软软的', 1800);
  },
  wake(quiet) { this.mode = 'idle'; this.nextIdle = performance.now() + 3000 + Math.random() * 3000; if (!quiet) this.react('wake'); },
  idle() {   // left alone: potter about, nap, look out of the window, have a snack
    const it = this.items(), r = Math.random(), sad = !Pet.preview && Pet.s.attach < 25;
    if (sad && r < 0.6) return this.nap();
    if (r < 0.42) { for (let k = 0; k < 12; k++) { const u = 0.1 + Math.random() * 0.8, v = 0.1 + Math.random() * 0.8; if (this.free(u, v) && Math.hypot(u - this.pos.u, v - this.pos.v) > 0.18) return this.walkTo(u, v, null, Math.random() < 0.5 ? 'crawl' : 'walk'); } }
    if (r < 0.54) return this.react('hop');
    if (r < 0.64) return this.react('shake');
    if (r < 0.74) return it.bed ? this.goto('bed') : this.nap();
    if (r < 0.83 && it.window) return this.goto('window');
    if (r < 0.9 && it.table) return this.goto('table');
    this.react('look');
  },
  hover(e) {
    if (e.pointerType !== 'mouse' || !this.present() || this.drag || this.fall || this.press) return;
    // only when you reach out and touch it, not when it walks into a mouse that's sitting still
    const t = performance.now(); if (t < this.hoverAt || this.mode === 'act' || this.mode === 'walk' || t - (this.movedAt || 0) > 250) return;
    this.hoverAt = t + 1800;
    if (this.mode === 'sleep') { this.wake(true); this.react('shake'); return; }
    this.react(['roll', 'hop', 'spin', 'shake', 'shy', 'roll'][Math.floor(Math.random() * 6)]);
  },
  roomClick(e) {
    if (!this.present() || !this.shown || this.drag || this.fall) return;
    const f = e.target.closest('[data-f]')?.dataset.f || 'floor', uv = this.toUV(this.svgXY(e.clientX, e.clientY));
    this.ping(e);
    if (this.FURN[f]) return this.goto(f);
    if (f === 'floor' || f === 'rug') return this.walkTo(uv[0], uv[1]);
    this.walkTo(uv[0], uv[1], () => this.react('look'));   // a wall: go and have a look
  },
  eat() { if (!this.shown) return; if (this.items().table) this.goto('table'); else this.react('eat'); },
  // ------------------------------------------------------------- little effects
  ping(e) {
    const r = this.el.getBoundingClientRect(), s = document.createElement('span');
    s.className = 'pet-ping'; s.style.left = ((e.clientX - r.left) / r.width) * 100 + '%'; s.style.top = ((e.clientY - r.top) / r.height) * 100 + '%';
    this.el.appendChild(s); setTimeout(() => s.remove(), 800);
  },
  FX: {
    heart: '<svg viewBox="0 0 24 24"><path d="M12 21C4 15 1.5 10.5 3.5 7c2-3.2 6.3-3 8.5.5C14.2 4 18.5 3.8 20.5 7c2 3.5-.5 8-8.5 14z" fill="#FF7E8C" stroke="#5A3B2A" stroke-width="1.6"/></svg>',
    sparkle: '<svg viewBox="0 0 24 24"><path d="M12 2c1 6 3 8 10 10-7 2-9 4-10 10-1-6-3-8-10-10 7-2 9-4 10-10z" fill="#FFD66B" stroke="#5A3B2A" stroke-width="1.4" stroke-linejoin="round"/></svg>',
    drop: '<svg viewBox="0 0 24 24"><path d="M12 3C8 9 6 12 6 15a6 6 0 0 0 12 0c0-3-2-6-6-12z" fill="#8EC3F2" stroke="#5A3B2A" stroke-width="1.6"/></svg>',
    dust: '<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8" fill="#F3E8DA" stroke="#C9B8A4" stroke-width="1.5"/></svg>',
    zzz: '<b>z</b>',
  },
  fx(kind, n = 1) {
    const [l, tp] = this.pct(this.foot()), foot = kind === 'dust';
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span');
      s.className = 'pet-fx' + (kind === 'zzz' ? ' zzz' : '') + (foot ? ' dust' : '');
      s.innerHTML = this.FX[kind];
      s.style.left = l + (Math.random() - 0.5) * (foot ? 14 : 10) + '%';
      s.style.top = tp - (foot ? 1 : this.mode === 'sleep' ? 12 : 20) + (Math.random() - 0.5) * 4 + '%';
      s.style.setProperty('--dx', (Math.random() - 0.5) * 50 + 'px'); s.style.animationDelay = i * 110 + 'ms';
      this.el.appendChild(s); setTimeout(() => s.remove(), 1600 + i * 110);
    }
  },
  talk(text, ms = 1700) {
    this.say.textContent = text; this.say.hidden = false; if (this.shown) this.place();
    clearTimeout(this.sayT); this.sayT = setTimeout(() => { this.say.hidden = true; }, ms);
  },
};

/* ===================================================================== boot */
renderProfile();
Pet.init();
renderNav();
renderCities();
tickClock(); setInterval(tickClock, 1000);
if (Auto.on()) { Auto.grace = Date.now() + 6000; Auto.kick(6000); }
loadWeather();
initMap();
})();
</script>
