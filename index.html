<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<link rel="stylesheet" href="vendor/fonts/noto-serif-sc-700.css">
<title>Beyond Horizons</title>
<meta name="description" content="Beyond Horizons：Howard Leong 的个人主页，把吃过的餐厅、扫街照片、地标、日记和星空放在广州的街道地图上。">
<style>@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:400;font-display:swap;src:url(vendor/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:500;font-display:swap;src:url(vendor/fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2")}@font-face{font-family:"JetBrains Mono";font-style:normal;font-weight:600;font-display:swap;src:url(vendor/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2")}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: full-bleed street map; glass instrument panels pinned to the edges like a globe viewer's HUD.
   Left column = identity + layers, top = time & sound, right = orientation + places. */
:root{
  /* palette given by the owner */
  --ice:#DBEAFE; --blue:#2563EB; --bright:#3B82F6; --white:#FFFFFF;
  /* derived neutrals, biased toward the blues */
  --ink:#0E1F40; --ink-2:#44597F; --ink-3:#8194B8; --mist:#F2F6FC; --line:#D3E2F9; --ice-2:#EEF4FE;
  --glass:rgba(255,255,255,.88); --glass-strong:rgba(255,255,255,.97);
  --shadow:0 14px 34px -16px rgba(29,78,216,.34),0 2px 8px rgba(29,78,216,.07);
  --night:#06122B; --night-2:#0B1D44; --star:#EAF2FF;
  --good:#0E9F6E; --warn:#D97706;
  --f-display:"Noto Serif SC","Songti SC","STSong","Source Han Serif SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","SFMono-Regular",Menlo,Consolas,monospace;
  --r-lg:18px; --r-md:12px; --r-sm:8px;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--mist);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.55;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:2px solid var(--bright);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- MapLibre essentials (inlined, controls replaced by our own) */
.maplibregl-map{font:12px/20px Helvetica Neue,Arial,Helvetica,sans-serif;overflow:hidden;position:relative;-webkit-tap-highlight-color:rgb(0 0 0/0)}
.maplibregl-canvas{left:0;position:absolute;top:0}
.maplibregl-map:fullscreen{height:100%;width:100%}
.maplibregl-canvas-container.maplibregl-interactive.maplibregl-track-pointer{cursor:pointer}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate,.maplibregl-canvas-container.maplibregl-touch-zoom-rotate .maplibregl-canvas{touch-action:pan-x pan-y}
.maplibregl-canvas-container.maplibregl-touch-drag-pan,.maplibregl-canvas-container.maplibregl-touch-drag-pan .maplibregl-canvas{touch-action:pinch-zoom}
.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan,.maplibregl-canvas-container.maplibregl-touch-zoom-rotate.maplibregl-touch-drag-pan .maplibregl-canvas{touch-action:none}
.maplibregl-canvas-container.maplibregl-touch-drag-pan.maplibregl-cooperative-gestures,.maplibregl-canvas-container.maplibregl-touch-drag-pan.maplibregl-cooperative-gestures .maplibregl-canvas{touch-action:pan-x pan-y}
.maplibregl-marker{left:0;position:absolute;top:0;transition:opacity .2s;will-change:transform}
.maplibregl-user-location-dot,.maplibregl-user-location-dot:before{background-color:#1da1f2;border-radius:50%;height:15px;width:15px}
.maplibregl-user-location-dot:before{animation:maplibregl-user-location-dot-pulse 2s infinite;content:"";position:absolute}
.maplibregl-user-location-dot:after{border:2px solid #fff;border-radius:50%;box-shadow:0 0 3px rgba(0,0,0,.35);box-sizing:border-box;content:"";height:19px;left:-2px;position:absolute;top:-2px;width:19px}
.maplibregl-user-location-dot-stale{background-color:#aaa}
.maplibregl-user-location-dot-stale:after{display:none}
.maplibregl-user-location-accuracy-circle{background-color:#1da1f233;border-radius:100%;height:1px;width:1px}
.maplibregl-crosshair,.maplibregl-crosshair .maplibregl-interactive,.maplibregl-crosshair .maplibregl-interactive:active{cursor:crosshair}
.maplibregl-boxzoom{background:#fff;border:2px dotted #202020;height:0;left:0;opacity:.5;position:absolute;top:0;width:0}
.maplibregl-canvas-container.maplibregl-interactive{cursor:grab}
.maplibregl-canvas-container.maplibregl-interactive:active{cursor:grabbing}

#map{position:fixed;inset:0;transition:transform 1.2s cubic-bezier(.6,0,.25,1),opacity 1s ease}
/* looking up past the top of the map: the city sinks out of view while the sky rises */
body{transition:background-color .9s ease}
body.lifted{background:#02060F}
body.lifted #map{transform:translateY(48vh) scale(1.05);opacity:0}
body.lifted #skyDay{opacity:0}
#skyDay{position:fixed;inset:0;width:100%;height:100%;z-index:-2;pointer-events:none;transition:opacity .9s}
#ui{transition:opacity .45s}
body.lifted #ui{opacity:0;pointer-events:none}
body.lifted #ui > *{pointer-events:none}
#skyDome{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;opacity:0}
.pull-hint{position:fixed;z-index:3;display:flex;align-items:center;gap:9px;padding:5px 14px 5px 5px;border-radius:999px;font-size:12.5px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .35s,background-color .35s,color .35s,border-color .35s}
.pull-hint.show{opacity:1;pointer-events:auto}
.pull-hint .ring{position:relative;width:30px;height:30px;flex:none;display:grid;place-items:center;border-radius:50%}
.pull-hint .ring svg{position:absolute;inset:0;width:30px;height:30px;transform:rotate(-90deg)}
.pull-hint .ring circle{fill:none;stroke-width:2.2}
.pull-hint .ring .trk{stroke:currentColor;opacity:.16}
.pull-hint .ring .prog{stroke:var(--bright);stroke-linecap:round;stroke-dasharray:75.4;stroke-dashoffset:75.4}
.pull-hint .ring i{font-style:normal;font-size:13px;line-height:1;animation:nudge 1.6s ease-in-out infinite}
.pull-hint b{font-weight:600;font-size:13px}
.pull-hint span{opacity:.72}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.look-hint{left:0;top:0;transform:translate(-50%,-100%);border:1px solid rgba(37,99,235,.18);background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 22px -8px rgba(37,99,235,.35);color:var(--ink)}
.look-hint .ring{background:var(--ice);color:var(--blue)}
.look-hint.dark{background:rgba(8,18,40,.72);border-color:rgba(147,197,253,.3);color:#DBEAFE}
.look-hint.dark .ring{background:rgba(37,99,235,.3);color:#DBEAFE}
body.lifted .look-hint{opacity:0;pointer-events:none}

/* ---------- HUD grid */
#ui{position:fixed;inset:0;z-index:2;pointer-events:none;display:grid;
  grid-template-columns:minmax(272px,300px) minmax(0,1fr) minmax(232px,260px);
  grid-template-rows:auto minmax(0,1fr) auto;
  grid-template-areas:"left top right" "left mid right" "status mid zoom";
  gap:12px;
  padding-block:calc(14px + env(safe-area-inset-top,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ui > *{pointer-events:auto}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1px solid rgba(219,234,254,.95);box-shadow:var(--shadow)}

.col-left{grid-area:left;display:flex;flex-direction:column;gap:12px;min-height:0;pointer-events:none}
.col-left > *{pointer-events:auto}
.col-right{grid-area:right;display:flex;flex-direction:column;align-items:flex-end;gap:12px;min-height:0;pointer-events:none}
.col-right > *{pointer-events:auto}

/* ---------- profile */
.profile{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 10px 10px 10px;border-radius:var(--r-lg)}
.avatar-btn{position:relative;width:54px;height:54px;border-radius:14px;border:0;padding:0;overflow:hidden;background:var(--ice);box-shadow:0 0 0 2px var(--white),0 0 0 3.5px var(--ice)}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.avatar-btn:hover img{transform:scale(1.07)}
.avatar-btn::after{content:"";position:absolute;right:4px;bottom:4px;width:9px;height:9px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 2px var(--white)}
.who{min-width:0}
.who h1{margin:0;font-family:var(--f-display);font-weight:900;font-size:18px;letter-spacing:0;line-height:1.2;white-space:nowrap}
.who p{margin:4px 0 0;font-family:var(--f-mono);font-size:10.5px;line-height:1.35;color:var(--blue);letter-spacing:.12em;text-transform:uppercase}
.socials{display:grid;grid-template-columns:repeat(2,30px);gap:5px}
.socials a{width:30px;height:30px;display:grid;place-items:center;border-radius:9px;background:var(--ice-2);color:var(--blue);text-decoration:none;position:relative;transition:background .2s,color .2s,transform .2s}
.socials a:hover{background:var(--blue);color:var(--white);transform:translateY(-1px)}
.socials svg,.socials img{width:16px;height:16px;object-fit:contain}
.socials a::after{content:attr(data-label);position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);padding:3px 7px;border-radius:6px;background:var(--ink);color:var(--white);font-size:11px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
.socials a:hover::after,.socials a:focus-visible::after{opacity:1}
.socials a:hover,.socials a:focus-visible{z-index:6}
.sg{display:block;width:18px;height:18px;background:currentColor;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}

/* ---------- layer nav */
.nav{border-radius:var(--r-lg);padding:8px;display:flex;flex-direction:column;gap:2px}
.nav-title{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px 8px;font-size:11px;color:var(--ink-3);letter-spacing:.14em}
.nav-btn{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;padding:7px 8px;border:0;border-radius:12px;background:transparent;text-align:left;transition:background .2s,color .2s}
.nav-btn:hover{background:var(--ice-2)}
.nav-btn .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--ice);color:var(--blue);transition:background .2s,color .2s}
.nav-btn .ic svg{width:19px;height:19px}
.nav-btn .nm{display:flex;flex-direction:column;min-width:0}
.nav-btn .nm b{font-weight:500;font-size:15px;letter-spacing:.04em}
.nav-btn .nm small{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;color:var(--ink-3)}
.nav-btn .ct{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);min-width:22px;text-align:right}
.nav-btn[aria-pressed="true"]{background:var(--blue);color:var(--white)}
.nav-btn[aria-pressed="true"] .ic{background:rgba(255,255,255,.18);color:var(--white)}
.nav-btn[aria-pressed="true"] small,.nav-btn[aria-pressed="true"] .ct{color:rgba(255,255,255,.75)}

.mini-btn{width:26px;height:26px;flex:none;border:0;border-radius:8px;background:transparent;color:var(--ink-3);display:grid;place-items:center;padding:0;transition:background .2s,color .2s}
.mini-btn:hover{background:var(--ice-2);color:var(--blue)}
.mini-btn svg{width:15px;height:15px;transition:transform .25s}
.city-pill{display:none;align-items:center;gap:8px;margin-top:14px;padding:8px 10px 8px 12px;border-radius:14px;font-size:13px;white-space:nowrap;animation:pop .22s ease-out}
.city-pill b{font-weight:500;font-size:14px}
.city-pill .sub{color:var(--ink-2)}
.city-pill .ct{font-family:var(--f-mono);font-size:11px;color:var(--blue);background:var(--ice);border-radius:999px;padding:1px 7px}
.city-pill svg{width:14px;height:14px;color:var(--ink-3)}
.city-pill:hover{background:var(--white)}
@keyframes pop{from{opacity:.5;transform:scale(.96)}to{opacity:1;transform:none}}
.top{transition:transform .38s cubic-bezier(.2,.8,.2,1),opacity .28s}
.top-handle{display:none;grid-area:top;justify-self:center;align-self:start;align-items:center;gap:8px;height:28px;padding:0 12px;margin-top:-4px;border-radius:0 0 12px 12px;border-top:0;font-size:12px;color:var(--ink-2);white-space:nowrap;animation:pop .25s ease-out}
.top-handle svg{width:14px;height:14px;color:var(--blue)}
.top-handle .eq{height:10px;width:14px}
.top-handle .eq i{width:2px}
@media (min-width:1024px){
  #ui.top-hide .top{transform:translateY(calc(-100% - 24px));opacity:0;pointer-events:none}
  #ui.top-hide .top-handle{display:flex}
}
@media (min-width:1024px){
  #ui.nav-min .nav{align-self:flex-start;width:60px;padding:6px;animation:pop .22s ease-out}
  #ui.nav-min .nav-title{justify-content:center;padding:2px 0 4px}
  #ui.nav-min .nav-title span{display:none}
  #ui.nav-min .nav-title .mini-btn svg{transform:rotate(180deg)}
  #ui.nav-min .nav-btn{grid-template-columns:1fr;justify-items:center;padding:5px;position:relative}
  #ui.nav-min .nav-btn .nm,#ui.nav-min .nav-btn .ct{display:none}
  #ui.nav-min .nav-btn::after{content:attr(data-name);position:absolute;left:calc(100% + 12px);top:50%;transform:translateY(-50%);padding:4px 9px;border-radius:8px;background:var(--ink);color:var(--white);font-size:12px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s;z-index:5}
  #ui.nav-min .nav-btn:hover::after,#ui.nav-min .nav-btn:focus-visible::after{opacity:1}
  #ui.nav-min .friends{display:none}
  #ui.city-min .cities{display:none}
  #ui.city-min .city-pill{display:flex}
  .cities{animation:pop .22s ease-out}
}
.friends{border-radius:var(--r-lg);padding:10px 12px 12px;min-height:0;overflow:auto}
.friends h2{margin:0 0 6px;font-size:11px;font-weight:500;letter-spacing:.14em;color:var(--ink-3);display:flex;justify-content:space-between}
.friend{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:10px;text-decoration:none;color:var(--ink)}
.friend:hover{background:var(--ice-2)}
.friend .fav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--blue);background:var(--ice);flex:none}
.friend .ft{min-width:0;display:flex;flex-direction:column;line-height:1.3}
.friend .ft b{font-weight:500;font-size:13px}
.friend .ft small{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag-sample{display:inline-block;font-size:10px;line-height:1;padding:3px 6px;border-radius:999px;background:var(--ice);color:var(--blue);font-weight:500;letter-spacing:.06em;vertical-align:middle}

/* ---------- top bar */
.top{grid-area:top;justify-self:center;position:relative;display:flex;align-items:stretch;border-radius:999px;padding:5px;gap:2px;max-width:100%}
.seg{display:flex;align-items:center;gap:9px;padding:4px 14px;border:0;background:transparent;border-radius:999px;white-space:nowrap;transition:background .2s}
button.seg:hover,button.seg[aria-expanded="true"]{background:var(--ice-2)}
.seg + .seg{position:relative}
.seg + .seg::before{content:"";position:absolute;left:-1px;top:9px;bottom:9px;width:1px;background:var(--line)}
.seg .big{font-size:14px;font-weight:500;line-height:1.2}
.seg .small{font-size:11px;color:var(--ink-3);line-height:1.2}
.seg.date{gap:12px;padding-left:16px}
.seg.date .stack{padding-left:12px;border-left:1px solid var(--line)}
.clock{display:inline-flex;align-items:baseline;font-family:var(--f-mono);font-size:24px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--ink);font-variant-numeric:tabular-nums}
.clock i{font-style:normal;color:var(--blue);margin:0 1px;position:relative;top:-.06em;animation:tick 2s steps(1) infinite}
@keyframes tick{50%{opacity:.25}}
.top-handle b{font-family:var(--f-mono);font-size:14px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.seg .stack{display:flex;flex-direction:column;align-items:flex-start}
.seg svg{width:20px;height:20px;color:var(--blue);flex:none}
.wx-ic svg{width:26px;height:26px}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:14px;width:16px}
.eq i{display:block;width:3px;height:4px;background:var(--blue);border-radius:1px}
.playing .eq i{animation:eq 1s ease-in-out infinite}
.playing .eq i:nth-child(2){animation-delay:-.3s}.playing .eq i:nth-child(3){animation-delay:-.6s}.playing .eq i:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}
.track-name{max-width:120px;overflow:hidden;text-overflow:ellipsis}

.pop{position:fixed;z-index:20;max-width:calc(100vw - 32px);max-height:calc(100% - 140px);overflow:auto;border-radius:var(--r-lg);padding:14px;background:var(--glass-strong);border:1px solid var(--line);box-shadow:var(--shadow)}
.pop h3{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:.06em}
.pop-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.icon-btn{width:30px;height:30px;border-radius:9px;border:0;background:var(--ice-2);display:grid;place-items:center;color:var(--blue)}
.icon-btn:hover{background:var(--ice)}
.icon-btn svg{width:16px;height:16px}

/* calendar */
#calPop{width:330px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-grid .dow{font-size:11px;color:var(--ink-3);padding:4px 0}
.cal-day{position:relative;display:flex;flex-direction:column;align-items:center;padding:5px 0 6px;border-radius:9px;font-family:var(--f-mono);font-size:13px;line-height:1.15}
.cal-day small{font-family:var(--f-body);font-size:9.5px;color:var(--ink-3);margin-top:2px}
.cal-day.muted{opacity:.35}
.cal-day.today{background:var(--blue);color:var(--white)}
.cal-day.today small{color:rgba(255,255,255,.8)}
.cal-day.has::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--bright)}
.cal-day.today.has::after{background:var(--white)}
.cal-day.term small{color:var(--blue);font-weight:500}
.cal-foot{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);font-size:12px;color:var(--ink-2)}
.moon-ic{width:26px;height:26px;flex:none}

/* diary popover */
#diaryPop{width:340px}
.d-list{display:flex;flex-direction:column;gap:4px;max-height:340px;overflow:auto}
.d-row{display:grid;grid-template-columns:48px minmax(0,1fr);gap:10px;align-items:start;text-align:left;padding:8px;border:0;border-radius:12px;background:transparent}
.d-row:hover{background:var(--ice-2)}
.d-date{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);line-height:1.25;padding-top:2px}
.d-date b{display:block;font-size:18px;color:var(--blue);font-weight:600}
.d-row h4{margin:0;font-size:14px;font-weight:500}
.d-row p{margin:2px 0 0;font-size:12px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11px;background:var(--ice);color:var(--blue);border:0}
.chip.off{background:var(--ice-2);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 12px;border-radius:10px;border:0;background:var(--blue);color:var(--white);font-size:13px;font-weight:500;text-decoration:none}
.btn:hover{background:#1D4ED8}
.btn svg{width:15px;height:15px;flex:none}
.d-nav .btn{flex:1;white-space:nowrap;padding:8px 6px;min-width:0}
.btn.ghost{background:var(--ice-2);color:var(--blue)}
.btn.ghost:hover{background:var(--ice)}

/* music popover */
#musicPop{width:320px}
.now{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center;margin-bottom:12px}
.disc{width:52px;height:52px;border-radius:50%;background:conic-gradient(from 0deg,var(--blue),var(--bright),var(--ice),var(--bright),var(--blue));position:relative;box-shadow:inset 0 0 0 6px rgba(255,255,255,.35)}
.disc::after{content:"";position:absolute;inset:19px;border-radius:50%;background:var(--white)}
.playing .disc{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.now b{display:block;font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.now small{font-size:12px;color:var(--ink-3)}
.transport{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.transport .play{width:40px;height:40px;border-radius:50%;border:0;background:var(--blue);color:var(--white);display:grid;place-items:center}
.transport .play svg{width:18px;height:18px}
.transport input[type=range]{flex:1;accent-color:var(--blue)}
.tracks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;max-height:230px;overflow:auto}
.trk{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:7px 8px;border:0;border-radius:10px;background:transparent;text-align:left}
.trk:hover{background:var(--ice-2)}
.trk[aria-current="true"]{background:var(--ice);color:var(--blue)}
.trk .n{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.trk b{font-weight:500;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trk small{font-size:11px;color:var(--ink-3)}
.trk.empty{opacity:.55;cursor:default}
.prog{display:flex;align-items:center;gap:8px;margin:-2px 0 10px;font-size:11px;color:var(--ink-3)}
.prog input{flex:1;accent-color:var(--blue)}
a.trk{text-decoration:none;color:inherit}
.trk .ext{font-size:11px;color:var(--blue);white-space:nowrap}
.transport .play:disabled,.transport .icon-btn:disabled{opacity:.4;cursor:not-allowed}
.note{font-size:11.5px;color:var(--ink-3);margin:10px 0 0;line-height:1.5}

/* ---------- compass */
.compass{width:68px;height:68px;border-radius:50%;padding:0;display:grid;place-items:center;position:relative}
.compass svg{width:60px;height:60px;transition:transform .12s linear}
.compass .deg{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10.5px;color:var(--ink-2);background:var(--glass);padding:1px 6px;border-radius:6px;white-space:nowrap}

/* ---------- city panel */
.cities{width:100%;border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;min-height:0;margin-top:14px}
.cities header{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:0 4px 10px;border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;color:var(--ink-3);text-transform:uppercase}
.cities h2{margin:2px 0 0;font-family:var(--f-display);font-size:18px;letter-spacing:.08em}
.cities .city-list{list-style:none;margin:8px 0 0;padding:0;overflow:auto;min-height:0;display:flex;flex-direction:column;gap:2px}
.city-btn{display:grid;grid-template-columns:minmax(0,1fr) auto 14px;align-items:center;gap:8px;width:100%;padding:8px;border:0;border-radius:10px;background:transparent;text-align:left}
.city-btn:hover{background:var(--ice-2)}
.city-btn b{font-weight:500;font-size:15px}
.city-btn small{font-family:var(--f-mono);font-size:10px;color:var(--ink-3);letter-spacing:.12em;margin-left:6px}
.city-btn .ct{font-family:var(--f-mono);font-size:12px;color:var(--blue);background:var(--ice);border-radius:999px;padding:1px 8px}
.city-btn svg{width:14px;height:14px;color:var(--ink-3);transition:transform .2s}
.city-btn[aria-expanded="true"] svg{transform:rotate(90deg)}
.city-btn:disabled{cursor:default;opacity:.5}
.city-btn:disabled:hover{background:transparent}
.items{list-style:none;margin:2px 0 6px 8px;padding:0 0 0 10px;border-left:2px solid var(--ice);display:flex;flex-direction:column;gap:1px}
.item-btn{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;padding:6px 8px;border:0;border-radius:8px;background:transparent;text-align:left;font-size:13px}
.item-btn:hover,.item-btn[aria-current="true"]{background:var(--ice-2);color:var(--blue)}
.item-btn span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item-btn .meta{font-family:var(--f-mono);font-size:11px;color:var(--ink-3)}
.group-label{font-size:10.5px;letter-spacing:.14em;color:var(--ink-3);padding:6px 8px 2px}
.fcats{display:flex;flex-wrap:wrap;gap:4px;padding:4px 4px 6px}
.fcat{border:1px solid var(--line);background:var(--white);color:var(--ink-2);border-radius:999px;padding:2px 9px;font-size:11.5px;line-height:1.6}
.fcat:hover{border-color:var(--bright);color:var(--blue)}
.fcat[aria-pressed="true"]{background:var(--blue);border-color:var(--blue);color:var(--white)}
.item-btn.nopin span:first-child{color:var(--ink-3)}
.pin-food.noscore .pb b{color:var(--ink-3)}
/* zoomed out: restaurants merge into one bubble per area (or district) */
.fgroup .gb{display:flex;align-items:center;gap:7px;padding:4px 5px 4px 12px;border-radius:999px;background:rgba(255,255,255,.94);border:1px solid rgba(37,99,235,.22);box-shadow:0 8px 20px -10px rgba(29,78,216,.55);white-space:nowrap}
.fgroup .gb b{font-size:12.5px;font-weight:600;color:var(--ink)}
.fgroup .gb i{min-width:24px;height:24px;padding:0 6px;border-radius:999px;background:var(--blue);color:var(--white);font-style:normal;font-family:var(--f-mono);font-size:12px;font-weight:600;display:grid;place-items:center}
.fgroup.district .gb{padding:6px 6px 6px 15px;gap:9px}
.fgroup.district .gb b{font-size:14px;font-family:var(--f-display);letter-spacing:.06em}
.fgroup.district .gb i{min-width:28px;height:28px;font-size:13px}
.fgroup:hover .gb{background:var(--blue);border-color:var(--blue)}
.fgroup:hover .gb b{color:var(--white)}
.fgroup:hover .gb i{background:var(--white);color:var(--blue)}
/* chain branches: shown only while that chain's card is open; everything else steps back */
#map.chainview .fgroup{visibility:hidden!important}
#map.chainview .pin-food{opacity:.18!important;pointer-events:none}
.pin-branch .pb{display:flex;align-items:center;gap:0;padding:3px;border-radius:999px;background:var(--white);border:1.5px solid var(--blue);font-size:11.5px;color:var(--ink);white-space:nowrap;transition:gap .2s,padding .2s}
.pin-branch .pb i{width:10px;height:10px;border-radius:50%;background:var(--blue)}
.pin-branch .lbl{max-width:0;overflow:hidden;transition:max-width .25s}
.pin-branch:hover .pb,#map.near .pin-branch .pb{gap:5px;padding-right:9px}
.pin-branch:hover .lbl,#map.near .pin-branch .lbl{max-width:180px}
.pin-branch .pin-tail{height:4px}
.pin-branch .pin-tail::after{width:5px;height:5px;margin-top:3px;margin-left:-1.5px}
.f-branches{max-height:150px;overflow:auto}
.pin-stack .pb .sn{font-family:var(--f-body);font-size:12px;font-weight:600;color:var(--ink)}
.pin-stack .pb .sc{font-style:normal;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--blue);color:var(--white);font-family:var(--f-mono);font-size:11.5px;font-weight:600;display:grid;place-items:center}
.pin-stack.is-active .pb .sn{color:var(--white)}
.pin-stack.is-active .pb .sc{background:var(--white);color:var(--blue)}
.stack-pop{position:absolute;top:0;left:0;display:flex;flex-direction:column-reverse;align-items:center;will-change:transform;pointer-events:none;z-index:5}
.stack-pop .maplibregl-popup-content{pointer-events:auto;background:var(--white);padding:6px;border-radius:14px;box-shadow:var(--shadow);border:1px solid var(--line)}
.stack-pop .maplibregl-popup-tip{width:0;height:0;border:8px solid transparent;border-top-color:var(--white);border-bottom:none;margin-top:-1px}
.stack-list{display:flex;flex-direction:column;gap:1px;min-width:200px;font-family:var(--f-body)}
.sl-h{font-size:11px;letter-spacing:.12em;color:var(--ink-3);padding:4px 8px 6px}
.sl-i{display:flex;justify-content:space-between;align-items:center;gap:12px;border:0;background:transparent;padding:7px 8px;border-radius:9px;text-align:left;font-size:13px;color:var(--ink)}
.sl-i:hover{background:var(--ice-2);color:var(--blue)}
.sl-i b{font-family:var(--f-mono);font-size:12px;color:var(--blue)}
/* zoomed out: food pins shrink to dots shaded by score, and open up on hover */
#map.far .pin-food .pb{gap:0;padding:2px;border-width:1.5px}
#map.far .pin-food .pb i{width:11px;height:11px}
#map.far .pin-food .pb i svg,#map.far .pin-food .pb b{display:none}
#map.far .pin-food .pin-tail{height:3px}
#map.far .pin-food .pin-tail::after{width:4px;height:4px;margin:2px 0 0 -1px}
#map.far .pin-food.t-mid .pb i{background:var(--bright)}
#map.far .pin-food.t-lo .pb i{background:#93C5FD}
#map.far .pin-food.noscore .pb i{background:#B6C3D9}
#map.far .pin-food.noscore .pb{border-color:#B6C3D9}
#map.far .pin-food:hover .pb,#map.far .pin-food.is-active .pb{gap:5px;padding:4px 8px 4px 5px}
#map.far .pin-food:hover .pb i,#map.far .pin-food.is-active .pb i{width:22px;height:22px}
#map.far .pin-food:hover .pb i svg,#map.far .pin-food.is-active .pb i svg,#map.far .pin-food:hover .pb b,#map.far .pin-food.is-active .pb b{display:block}
.f-score{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--bright));color:var(--white)}
.f-score .score-big.none{opacity:.85}
.f-loc{cursor:pointer;border:0}
.f-loc svg{width:12px;height:12px}
.f-loc:hover{background:var(--blue);color:var(--white)}
.d-note{margin:0;font-size:12px;color:var(--ink-3)}

/* ---------- zoom + status */
.zoom{grid-area:zoom;justify-self:end;align-self:end;display:flex;flex-direction:column;border-radius:14px;overflow:hidden;width:42px}
.zoom button{height:40px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-2)}
.zoom button:hover{background:var(--ice-2);color:var(--blue)}
.zoom button + button{border-top:1px solid var(--line)}
.zoom svg{width:18px;height:18px}
.zoom .t3d{font-family:var(--f-mono);font-size:12px;font-weight:600}
.zoom .t3d[aria-pressed="true"]{color:var(--blue);background:var(--ice-2)}
.status{grid-area:status;align-self:end;justify-self:start;border-radius:12px;padding:7px 12px;font-size:11px;color:var(--ink-2);display:flex;flex-direction:column;gap:2px;max-width:100%}
.status .coord{font-family:var(--f-mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
.status .attr{color:var(--ink-3)}
.status .attr a{color:var(--ink-2)}

/* ---------- detail card */
.detail{position:fixed;z-index:6;top:calc(80px + env(safe-area-inset-top,0px));right:calc(max(16px,env(safe-area-inset-right,0px)) + 260px + 14px);width:380px;max-height:calc(100% - 120px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;border-radius:20px;background:var(--glass-strong);border:1px solid var(--line);box-shadow:0 24px 60px -24px rgba(29,78,216,.45),0 2px 10px rgba(29,78,216,.08);overflow:hidden;animation:rise .28s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}
.detail-scroll{overflow:auto;min-height:0}
.detail .close{position:absolute;top:10px;right:10px;z-index:2;background:rgba(255,255,255,.9)}
.d-hero{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--ice);overflow:hidden}
.d-hero img{width:100%;height:100%;object-fit:cover;display:block}
.d-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:14px}
.d-kicker{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
.d-kicker .k-sub{margin-left:-2px}
/* 吃饭地图：地址 + 跳转到高德 / 百度 / 苹果地图 */
.f-addrs{display:grid;gap:8px}
.f-addr{padding:10px 12px 11px;border-radius:12px;background:var(--ice-2)}
.fa-top{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px}
.fa-top b{font-weight:600;color:var(--ink)}
.mini-link{border:0;background:transparent;color:var(--blue);font:inherit;font-size:12px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;padding:2px 2px;flex:none}
.mini-link svg{width:13px;height:13px}
.fa-txt{margin:3px 0 9px;font-size:12.5px;color:var(--ink-2);line-height:1.55}
.fa-txt small{color:var(--ink-3)}
.fa-copy{border:0;background:transparent;color:var(--ink-3);cursor:pointer;padding:0 0 0 4px;vertical-align:-2px}
.fa-copy svg{width:13px;height:13px}
.fa-copy:hover{color:var(--blue)}
.fa-nav{display:flex;gap:6px;flex-wrap:wrap}
.navbtn{display:inline-flex;align-items:center;gap:5px;padding:5px 11px 5px 9px;border-radius:999px;background:var(--white);border:1px solid var(--line);color:var(--ink);font-size:12px;line-height:1.2;text-decoration:none;transition:border-color .15s,color .15s}
.navbtn svg{width:12px;height:12px;color:var(--blue)}
.navbtn:hover{border-color:var(--blue);color:var(--blue)}
.d-kicker .k-sub::before{content:"·";margin-right:6px;color:var(--ink-3)}
.d-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.04em;line-height:1.3;text-wrap:balance}
.d-sub{margin:-8px 0 0;font-size:12.5px;color:var(--ink-2)}
.d-text{margin:0;font-size:14px;line-height:1.8;color:var(--ink)}
.d-quote{margin:0;padding:12px 14px;border-radius:12px;background:var(--ice-2);font-size:13.5px;line-height:1.8;color:var(--ink-2)}
.d-quote b{display:block;font-size:11px;letter-spacing:.14em;color:var(--blue);margin-bottom:4px;font-weight:500}
.d-meta{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;margin:0;font-size:12.5px}
.d-meta dt{color:var(--ink-3)}
.d-meta dd{margin:0;color:var(--ink)}
.d-nav{display:flex;gap:8px;justify-content:space-between}
.score-wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,var(--blue),var(--bright));color:var(--white)}
.score-big{font-family:var(--f-mono);font-weight:600;font-size:40px;line-height:1;letter-spacing:-.02em}
.score-big small{display:block;font-family:var(--f-body);font-weight:400;font-size:11px;letter-spacing:.14em;opacity:.8;margin-top:6px}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:42px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:11.5px}
.bar i{display:block;height:5px;border-radius:3px;background:rgba(255,255,255,.25);overflow:hidden}
.bar i em{display:block;height:100%;background:var(--white);border-radius:3px}
.bar span:last-child{font-family:var(--f-mono);text-align:right}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gallery button{padding:0;border:0;border-radius:8px;overflow:hidden;aspect-ratio:4/3;max-width:100%;background:var(--ice);outline-offset:1px}
.gallery button[aria-current="true"]{box-shadow:0 0 0 2px var(--blue)}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.exif{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);letter-spacing:.04em}
/* 扫街卡片：直接一组小图，带入场、悬停倾斜/高光、缓慢呼吸的动态效果；点开后从小图放大成全屏 */
.shots{display:grid;gap:8px;grid-template-columns:repeat(3,1fr);perspective:800px}
.shots.n1{grid-template-columns:1fr;width:68%}
.shots.n2,.shots.n4{grid-template-columns:1fr 1fr}
.shot{--rx:0deg;--ry:0deg;--ty:0px;position:relative;display:block;padding:0;border:0;border-radius:12px;overflow:hidden;aspect-ratio:1/1;background:var(--ice);cursor:zoom-in;transform:translateY(var(--ty)) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;box-shadow:0 2px 8px rgba(15,37,87,.10);animation:shotIn .75s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i) * 90ms + 120ms);outline-offset:2px}
.shots.n1 .shot,.shots.n2 .shot,.shots.n4 .shot{aspect-ratio:4/3}
.shot::before{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%) 0 0/250% 100%;animation:shimmer 1.3s linear infinite}
.shot.ok::before{display:none}
.shot .ph{position:absolute;inset:0;animation:drift 18s ease-in-out infinite alternate;animation-delay:calc(var(--i) * -4.5s)}
.shot img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transform:scale(1.14);transition:opacity .7s ease,transform 1.1s cubic-bezier(.2,.8,.2,1)}
.shot.ok img{opacity:1;transform:scale(1)}
.shot .gl{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,30%),rgba(255,255,255,.55),transparent 58%);opacity:0;transition:opacity .35s;mix-blend-mode:soft-light}
.shot .cap{position:absolute;left:0;right:0;bottom:0;padding:22px 9px 7px;background:linear-gradient(rgba(8,18,40,0),rgba(8,18,40,.7));color:#fff;font-size:11.5px;line-height:1.35;text-align:left;transform:translateY(102%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.shot:hover,.shot:focus-visible{--ty:-4px;box-shadow:0 16px 30px -12px rgba(15,37,87,.5)}
.shot.ok:hover img{transform:scale(1.07)}
.shot:hover .gl{opacity:1}
.shot:hover .cap,.shot:focus-visible .cap{transform:none}
.shot.lifted{visibility:hidden}
.shots-hint{margin:-2px 0 0;font-size:11.5px;color:var(--ink-3)}
@keyframes shotIn{from{opacity:0;transform:translateY(18px) scale(.88) rotate(var(--r,0deg));filter:blur(5px)}}
@keyframes shimmer{to{background-position:-250% 0}}
@keyframes drift{from{transform:scale(1.02) translate(0,0)}to{transform:scale(1.08) translate(-1.6%,-1.2%)}}
@media (hover:none){.shot .cap{transform:none;font-size:10.5px;padding:16px 7px 5px}}
@media (prefers-reduced-motion:reduce){.shot,.shot .ph,.shot::before{animation:none!important}.shot{transform:none!important}.shot img{transition:none}}
.d-cap{margin:-4px 0 0;font-size:12px;color:var(--ink-3)}
.d-hero.zoomable img{cursor:zoom-in}
.zoom-hint{position:absolute;right:10px;bottom:10px;padding:2px 8px;border-radius:999px;background:rgba(8,18,40,.55);color:#fff;font-family:var(--f-mono);font-size:11px}
.zoom-hint:empty{display:none}
.viewer{position:fixed;inset:0;z-index:30;background:rgba(4,10,24,.92);display:grid;place-items:center;padding:56px 16px 64px;cursor:zoom-out}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);will-change:transform;user-select:none;-webkit-user-select:none}
.viewer .vcap{position:absolute;left:0;right:0;bottom:22px;text-align:center;color:#DBEAFE;font-size:13px}
.viewer button{position:absolute;width:42px;height:42px;border-radius:50%;border:1px solid rgba(219,234,254,.25);background:rgba(15,30,60,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.viewer button svg{width:18px;height:18px}
.viewer .vclose{top:14px;right:14px}
.viewer .prev{left:14px;top:50%;transform:translateY(-50%)}
.viewer .next{right:14px;top:50%;transform:translateY(-50%)}

/* ---------- pins */
.pin{border:0;background:transparent;padding:0;cursor:pointer}
.pin.is-active{z-index:3}
.pin-in{display:flex;flex-direction:column;align-items:center;filter:drop-shadow(0 6px 10px rgba(29,78,216,.28));transform-origin:50% 100%;transition:transform .18s}
.pin:hover .pin-in,.pin.is-active .pin-in{transform:translateY(-3px) scale(1.06)}
.pin-tail{width:2px;height:9px;background:var(--blue)}
.pin-tail::after{content:"";display:block;width:6px;height:6px;border-radius:50%;background:var(--blue);margin:7px 0 0 -2px;box-shadow:0 0 0 2px var(--white)}
.pin-food .pb{display:flex;align-items:center;gap:5px;padding:4px 8px 4px 5px;border-radius:999px;background:var(--white);border:1.5px solid var(--blue)}
.pin-food .pb i{width:22px;height:22px;border-radius:50%;background:var(--blue);color:var(--white);display:grid;place-items:center}
.pin-food .pb i svg{width:13px;height:13px}
.pin-food .pb b{font-family:var(--f-mono);font-size:12.5px;font-weight:600;color:var(--blue)}
.pin-food .pb span{font-size:12px;max-width:0;overflow:hidden;white-space:nowrap;transition:max-width .25s}
.pin-food:hover .pb span,.pin-food.is-active .pb span{max-width:140px}
.pin-food.is-active .pb{background:var(--blue)}
.pin-food.is-active .pb b,.pin-food.is-active .pb span{color:var(--white)}
.pin-food.is-active .pb i{background:var(--white);color:var(--blue)}
.pin-photo .pb{width:46px;height:46px;border-radius:14px;overflow:hidden;border:3px solid var(--white);background:var(--ice);transform:rotate(-4deg)}
.pin-photo .pb img{width:100%;height:100%;object-fit:cover;display:block}
.pin-photo.is-active .pb{border-color:var(--blue)}
.pin-mark .pb{display:flex;align-items:center;gap:0;padding:5px;border-radius:10px;background:var(--blue);color:var(--white);font-size:12.5px;font-weight:500;white-space:nowrap;border:1.5px solid var(--white);transition:gap .2s,padding .2s}
.pin-mark .pb svg{width:15px;height:15px;flex:none}
.pin-mark .lbl{max-width:0;overflow:hidden;transition:max-width .25s}
.pin-mark:hover .pb,.pin-mark.is-active .pb{gap:6px;padding-right:10px}
.pin-mark:hover .lbl,.pin-mark.is-active .lbl{max-width:240px}
.pin-mark.is-active .pb{background:var(--ink)}
/* zoomed out: small dots. Close up in 3D: dots too, so the pins don't cover the models (the models are clickable) */
#map.far .pin-mark .pb,#map.near.tilted .pin-mark .pb{padding:0;gap:0;width:13px;height:13px;border-radius:50%;border-width:2px}
#map.far .pin-mark .pb svg,#map.near.tilted .pin-mark .pb svg{display:none}
#map.far .pin-mark .lbl,#map.near.tilted .pin-mark .lbl{max-width:0}
#map.far .pin-mark .pin-tail,#map.near.tilted .pin-mark .pin-tail{height:3px}
#map.far .pin-mark .pin-tail::after,#map.near.tilted .pin-mark .pin-tail::after{width:4px;height:4px;margin:2px 0 0 -1px}
#map.far .pin-mark:hover .pb,#map.far .pin-mark.is-active .pb,#map.near.tilted .pin-mark:hover .pb{width:auto;height:auto;gap:6px;padding:5px 10px 5px 5px;border-radius:10px}
#map.far .pin-mark:hover .pb svg,#map.far .pin-mark.is-active .pb svg,#map.near.tilted .pin-mark:hover .pb svg{display:block}
#map.far .pin-mark:hover .lbl,#map.far .pin-mark.is-active .lbl,#map.near.tilted .pin-mark:hover .lbl{max-width:240px}
.pin-diary{--c:var(--bright)}
.pin-diary .pb{display:flex;align-items:center;gap:0;padding:3px;border-radius:999px;background:var(--white);font-size:11.5px;color:var(--ink);white-space:nowrap;transition:gap .2s,padding .2s,background-color .2s}
.pin-diary .pb i{width:12px;height:12px;flex:none;border-radius:50%;background:var(--c)}
.pin-diary.work .pb i{background:var(--white);box-shadow:inset 0 0 0 3px var(--c)}
.pin-diary .lbl{max-width:0;overflow:hidden;transition:max-width .25s}
.pin-diary:hover .pb,.pin-diary.is-active .pb,#map.near .pin-diary .pb{gap:5px;padding-right:9px}
.pin-diary:hover .lbl,.pin-diary.is-active .lbl,#map.near .pin-diary .lbl{max-width:200px}
.pin-diary.is-active .pb{background:var(--c);color:var(--white)}
.pin-diary.is-active .pb i{background:var(--white);box-shadow:none}
.pin-diary.work.is-active .pb i{background:transparent;box-shadow:inset 0 0 0 3px var(--white)}
.pin-diary .pin-tail{height:4px;background:var(--c)}
.pin-diary .pin-tail::after{width:5px;height:5px;margin-top:3px;margin-left:-1.5px;background:var(--c)}
/* colour key: list dots + the small tag in the detail card */
.kdot{display:inline-block;width:9px;height:9px;flex:none;border-radius:50%;background:var(--c);margin-right:7px;vertical-align:0}
.kdot.work{background:var(--white);box-shadow:inset 0 0 0 2.5px var(--c)}
.item-btn .kname{display:flex;align-items:center;min-width:0}
.item-btn .kname em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.ktag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:11.5px;font-weight:500;color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.ktag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.ktag.work::before{background:transparent;box-shadow:inset 0 0 0 2px var(--c)}
.pin:hover{z-index:4}

/* ---------- drawers */
.drawer{position:fixed;z-index:8;top:0;bottom:0;left:0;width:min(380px,100%);background:var(--glass-strong);border-right:1px solid var(--line);box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(-102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);visibility:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none;visibility:visible}
.drawer-in{overflow:auto;padding:20px max(20px,env(safe-area-inset-left,0px)) 24px 20px;display:flex;flex-direction:column;gap:18px}
.pf-head{display:grid;grid-template-columns:96px minmax(0,1fr);gap:16px;align-items:center}
.pf-head img{width:96px;height:96px;border-radius:24px;object-fit:cover;box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--ice)}
.pf-head h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:26px;letter-spacing:.02em;line-height:1.2}
.pf-head p{margin:2px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--ink-3);letter-spacing:.06em}
.pf-sec h3{margin:0 0 8px;font-size:11px;font-weight:500;letter-spacing:.16em;color:var(--ink-3)}
.pf-links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pf-links a{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:12px;background:var(--ice-2);text-decoration:none;color:var(--ink);font-size:13px}
.pf-links a:hover{background:var(--ice);color:var(--blue)}
.pf-links svg,.pf-links img{width:16px;height:16px;color:var(--blue);object-fit:contain}
.pf-links .sg{width:17px;height:17px;color:var(--blue)}
.scrim{position:fixed;inset:0;z-index:7;background:rgba(14,31,64,.18)}

/* ---------- toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;padding:9px 14px;border-radius:12px;background:var(--ink);color:var(--white);font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

/* ---------- loading veil */
.veil{position:fixed;inset:0;z-index:1;display:grid;place-items:center;pointer-events:none;transition:opacity .6s}
.veil.gone{opacity:0}
.veil div{display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--f-mono);font-size:12px;color:var(--ink-3);letter-spacing:.12em}
.veil b{font-family:var(--f-display);font-size:28px;letter-spacing:.12em;color:var(--blue);font-weight:900}

/* ---------- immersive sky (its own night world) */
.sky{position:fixed;inset:0;z-index:12;background:#02060F;color:var(--star);overflow:hidden;touch-action:none}
#skyCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;outline:none}
#skyCanvas:active{cursor:grabbing}
.sky::after{content:"";position:absolute;inset:0 0 auto;height:130px;background:linear-gradient(rgba(2,6,15,.6),rgba(2,6,15,0));pointer-events:none;z-index:1}
.sky > :not(canvas){z-index:2}
.sky-top{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:flex-start;gap:12px;pointer-events:none}
.sky-top > *{pointer-events:auto}
.sky-title h2{margin:0;font-family:var(--f-display);font-weight:900;font-size:22px;letter-spacing:.14em;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.sky-title p{margin:2px 0 0;font-family:var(--f-mono);font-size:11.5px;color:#A9C1EC;text-shadow:0 1px 8px rgba(0,0,0,.7)}
.sky-views{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
.sky-btn{width:38px;height:38px;flex:none;border-radius:12px;border:1px solid rgba(147,197,253,.2);background:rgba(8,18,40,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:var(--star);display:grid;place-items:center}
.sky-btn:hover{background:rgba(37,99,235,.45)}
.sky-btn svg{width:17px;height:17px}
.sky-pill{height:34px;padding:0 12px;border-radius:999px;border:1px solid rgba(147,197,253,.2);background:rgba(8,18,40,.62);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#C9DAF8;font-size:12.5px;white-space:nowrap}
.sky-pill:hover{background:rgba(37,99,235,.35);color:#fff}
.sky-pill[aria-pressed="true"]{background:rgba(37,99,235,.75);border-color:rgba(147,197,253,.55);color:#fff}
.sky-bar{position:absolute;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;pointer-events:none}
.sky-bar > *{pointer-events:auto}
.sky-clock{display:flex;align-items:baseline;gap:8px;padding:8px 14px;border-radius:14px;background:rgba(8,18,40,.62);border:1px solid rgba(147,197,253,.2);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.sky-clock b{font-weight:500;font-size:14px}
.sky-clock span{font-size:16px;color:#fff}
.sky-clock small{font-size:11px;color:#8FB0EA}
.sky-tbtns{display:flex;align-items:center;gap:6px}
.sky-toggles{margin-left:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.sky-toggles::-webkit-scrollbar{display:none}
.sky-hint{position:absolute;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);padding:7px 14px;border-radius:999px;background:rgba(8,18,40,.55);font-size:12.5px;color:#C9DAF8;white-space:nowrap;pointer-events:none;transition:opacity .8s}
.sky-hint.fade{opacity:0}
/* arriving from the map: the sky rises in, the chrome follows; leaving reverses it */
@keyframes skyIn{from{opacity:0}to{opacity:1}}
@keyframes skyOut{from{opacity:1}to{opacity:0}}
.sky.from-map{animation:skyIn 1s ease .12s both}
.sky.from-map .sky-top,.sky.from-map .sky-bar{animation:skyIn .7s ease 1.5s both}
.sky.leaving{animation:skyOut .75s ease .25s both;pointer-events:none}
.sky-back{left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);border:1px solid rgba(147,197,253,.28);background:rgba(8,18,40,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#DBEAFE}
.sky-back .ring{background:rgba(37,99,235,.3)}
.sky-info{position:absolute;left:max(16px,env(safe-area-inset-left,0px));top:calc(78px + env(safe-area-inset-top,0px));width:min(300px,calc(100% - 32px));padding:14px 16px;border-radius:16px;background:rgba(8,18,40,.72);border:1px solid rgba(147,197,253,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sky-info h3{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.08em}
.sky-info .k{font-size:11px;letter-spacing:.16em;color:#8FB0EA}
.sky-info table{width:100%;border-collapse:collapse;margin-top:8px;font-size:12.5px}
.sky-info td{padding:4px 0;border-bottom:1px solid rgba(147,197,253,.1);color:#C9DAF8}
.sky-info td:last-child{text-align:right;font-family:var(--f-mono);font-size:12px;color:#fff}
.sky-info .x{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:9px}
.sky-tonight{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(124px + env(safe-area-inset-top,0px));width:280px;max-height:calc(100% - 220px);overflow:auto;padding:14px 16px;border-radius:16px;background:rgba(8,18,40,.72);border:1px solid rgba(147,197,253,.22);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);display:flex;flex-direction:column;gap:12px}
.sky-tonight h3{margin:0 0 4px;font-size:11px;font-weight:500;letter-spacing:.16em;color:#8FB0EA}
.sky-tonight table{width:100%;border-collapse:collapse;font-size:12.5px}
.sky-tonight td{padding:4px 0;border-bottom:1px solid rgba(147,197,253,.1);color:#C9DAF8}
.sky-tonight td:last-child{text-align:right;font-family:var(--f-mono);font-size:11.5px}
.sky-tonight p{margin:0;font-size:12.5px;color:#C9DAF8;line-height:1.6}
.moon-row{display:flex;align-items:center;gap:12px}
.moon-row canvas{width:52px;height:52px;flex:none}
.moon-row b{display:block;font-size:15px;font-weight:500}
.moon-row small{color:#9DB6E6;font-size:12px}

/* ---------- mobile */
.city-toggle{display:none}
@media (max-width:1023px){
  #ui{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:auto auto minmax(0,1fr) auto auto;
    grid-template-areas:"left right" "top top" "mid zoom" "city city" "nav nav";gap:8px;
    padding-block:calc(10px + env(safe-area-inset-top,0px)) calc(8px + env(safe-area-inset-bottom,0px))}
  .col-left{display:contents}
  .profile{grid-area:left;grid-template-columns:auto minmax(0,1fr);padding:6px 12px 6px 6px;justify-self:start;max-width:100%}
  .avatar-btn{width:40px;height:40px;border-radius:11px}
  .who h1{font-size:16px}
  .socials{display:none}
  .col-right{grid-area:right;display:block}
  .compass{width:52px;height:52px}
  .compass svg{width:46px;height:46px}
  .compass .deg{display:none}
  .top{justify-self:stretch;overflow-x:auto;scrollbar-width:none;border-radius:16px;padding:4px}
  .top::-webkit-scrollbar{display:none}
  .seg{padding:4px 10px}
  .seg .small{display:none}
  .seg.date .small{display:block}
  button.seg .big,button.seg .stack{display:none}
  .seg{padding:4px 8px;gap:7px}
  button.seg{padding:4px 9px}
  .clock{font-size:18px}
  .wx-ic{display:none}
  .seg.date{gap:8px;padding-left:10px}
  .seg.date .stack{padding-left:8px}
  .seg .big{font-size:13px}
  .wx-ic svg{width:22px;height:22px}
  .top{justify-content:space-between}
  .nav{grid-area:nav;flex-direction:row;padding:5px;gap:2px;border-radius:16px}
  .nav-title{display:none}
  .nav-btn{grid-template-columns:1fr;justify-items:center;gap:2px;padding:6px 2px;flex:1;min-width:0}
  .nav-btn .ic{width:30px;height:30px}
  .nav-btn .nm{align-items:center}
  .nav-btn .nm b{font-size:11.5px;letter-spacing:0;white-space:nowrap}
  .nav-btn .nm small,.nav-btn .ct{display:none}
  .friends{display:none}
  .cities{display:none}
  .cities.sheet{display:flex;position:fixed;left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));max-height:52%;margin:0;z-index:9;width:auto}
  .city-toggle{grid-area:city;display:flex;justify-self:start;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;border:0;font-size:13px}
  .city-toggle .ct{font-family:var(--f-mono);font-size:11px;color:var(--blue);background:var(--ice);border-radius:999px;padding:0 7px}
  .zoom{grid-area:zoom;width:38px}
  .zoom button{height:36px}
  .status{display:none}
  .detail{left:0;right:0;bottom:0;top:auto;width:auto;max-height:72%;border-radius:20px 20px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  #calPop,#diaryPop,#musicPop{left:max(8px,env(safe-area-inset-left,0px));right:max(8px,env(safe-area-inset-right,0px));width:auto;max-width:none}
  .sky-title h2{font-size:18px}
  .sky-back{bottom:calc(136px + env(safe-area-inset-bottom,0px))}
  .sky-views{position:absolute;top:46px;right:0}
  .sky-info{top:calc(118px + env(safe-area-inset-top,0px))}
  .sky-hint{top:calc(118px + env(safe-area-inset-top,0px));white-space:normal;width:max-content;max-width:calc(100% - 32px);text-align:center}
  .sky-tonight{left:max(16px,env(safe-area-inset-left,0px));width:auto;top:auto;bottom:calc(128px + env(safe-area-inset-bottom,0px));max-height:46%}
  .sky-clock span{font-size:14px}
  .sky-toggles{margin-left:0;flex-basis:100%}
}
@media (min-width:1024px) and (max-width:1279px){
  #ui{grid-template-columns:272px minmax(0,1fr) 232px}
  .top .seg{padding:4px 10px}
  .top .wx .small,.top .date .small,.track-name{display:none}
  .top button.seg .big,.top button.seg .stack{display:none}
  .clock{font-size:21px}
  .detail{right:calc(max(16px,env(safe-area-inset-right,0px)) + 232px + 14px);width:360px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>


<div id="map" role="region" aria-label="广州街道地图"></div>
<canvas id="skyDay" aria-hidden="true"></canvas>
<canvas id="skyDome" aria-hidden="true"></canvas>
<button class="pull-hint look-hint" id="lookHint" type="button" tabindex="-1"><span class="ring" aria-hidden="true"><svg viewBox="0 0 30 30"><circle class="trk" cx="15" cy="15" r="12"/><circle class="prog" cx="15" cy="15" r="12"/></svg><i>↑</i></span><b>抬头看星空</b><span id="lookHow">按住右键继续往上拖</span></button>
<div class="veil" id="veil"><div><b>Beyond Horizons</b><span>正在铺开广州的街道…</span></div></div>

<div id="ui">
  <div class="col-left">
    <section class="profile glass" aria-label="个人信息">
      <button class="avatar-btn" id="avatarBtn" aria-label="查看个人介绍"><img id="avatarImg" alt="Howard Leong 的头像：傍晚的天空"></button>
      <div class="who"><h1 id="ownerName"></h1><p id="ownerSub"></p></div>
      <nav class="socials" id="socials" aria-label="社交账号"></nav>
    </section>

    <nav class="nav glass" id="layerNav" aria-label="地图板块">
      <div class="nav-title"><span>地图板块</span><button class="mini-btn" id="navMin" aria-expanded="true" aria-label="收起地图板块"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg></button></div>
    </nav>

    <section class="friends glass" id="friends" aria-label="友情链接"></section>
  </div>

  <div class="top glass" id="topbar" role="toolbar" aria-label="日期、天气、月历、日记与音乐">
    <div class="seg date">
      <time class="clock" id="clock" aria-label="现在时间"><span id="clockH">00</span><i aria-hidden="true">:</i><span id="clockM">00</span></time>
      <div class="stack"><span class="big" id="dateBig"></span><span class="small" id="dateSmall"></span></div>
    </div>
    <div class="seg wx" id="wxSeg" title="">
      <span class="wx-ic" id="wxIcon" aria-hidden="true"></span>
      <div class="stack"><span class="big mono" id="wxBig">—</span><span class="small" id="wxSmall">广州</span></div>
    </div>
    <button class="seg" id="calBtn" aria-expanded="false" aria-controls="calPop" title="月历">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/><circle cx="8.5" cy="14" r=".9" fill="currentColor"/><circle cx="12" cy="14" r=".9" fill="currentColor"/><circle cx="15.5" cy="14" r=".9" fill="currentColor"/></svg>
      <span class="big">月历</span>
    </button>
    <button class="seg" id="diaryBtn" aria-expanded="false" aria-controls="diaryPop" title="日记">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5h11a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H6z"/><path d="M6 3.5v17M9.5 8.5h6M9.5 12h6M9.5 15.5h3.5"/></svg>
      <span class="big">日记</span>
    </button>
    <button class="seg" id="musicBtn" aria-expanded="false" aria-controls="musicPop" title="背景音乐">
      <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
      <span class="stack"><span class="big">BGM</span><span class="small track-name" id="trackMini">点击选择音乐</span></span>
    </button>

  </div>
  <div class="pop" id="calPop" hidden role="dialog" aria-label="月历"></div>

const PALETTES = [
  ['#1E3A8A', '#3B82F6', '#DBEAFE', '#F8D9C4'],
  ['#0F2557', '#2563EB', '#93C5FD', '#FDE7D2'],
  ['#172554', '#1D4ED8', '#BFDBFE', '#FFFFFF'],
  ['#1E40AF', '#60A5FA', '#E0F2FE', '#FCE7F3'],
];
function photoArt(seed, label, w = 480, h = 360) {
  const r = rng(seed); const P = PALETTES[seed % PALETTES.length];
  let bld = '';
  let x = -10;
  while (x < w + 10) {
    const bw = 18 + r() * 46, bh = h * (0.18 + r() * 0.42);
    bld += `<rect x="${x.toFixed(1)}" y="${(h - bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="${P[0]}" opacity="${(0.55 + r() * 0.45).toFixed(2)}"/>`;
    if (r() > 0.5) for (let k = 0; k < 6; k++) bld += `<rect x="${(x + 4 + r() * (bw - 8)).toFixed(1)}" y="${(h - bh + 6 + r() * (bh - 12)).toFixed(1)}" width="3" height="4" fill="${P[3]}" opacity=".85"/>`;
    x += bw + r() * 6;
  }
  const sunX = (0.2 + r() * 0.6) * w, sunY = h * (0.3 + r() * 0.2);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${P[1]}"/><stop offset=".7" stop-color="${P[2]}"/><stop offset="1" stop-color="${P[3]}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/><circle cx="${sunX.toFixed(0)}" cy="${sunY.toFixed(0)}" r="${(18 + r() * 16).toFixed(0)}" fill="#FFFFFF" opacity=".55"/>${bld}<rect x="14" y="14" rx="6" width="${label.length * 13 + 22}" height="24" fill="#FFFFFF" opacity=".88"/><text x="25" y="31" font-family="Noto Sans SC,PingFang SC,sans-serif" font-size="13" fill="#1E3A8A">${esc(label)}</text><text x="${w - 14}" y="${h - 12}" text-anchor="end" font-family="JetBrains Mono,monospace" font-size="11" fill="#FFFFFF" opacity=".8">示例照片 · 待替换</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}
function blueprintArt(item, w = 640, h = 360) {
  let grid = '';
  for (let x = 0; x <= w; x += 32) grid += `<path d="M${x} 0V${h}" stroke="#FFFFFF" stroke-opacity="${x % 128 ? 0.07 : 0.16}"/>`;
  for (let y = 0; y <= h; y += 32) grid += `<path d="M0 ${y}H${w}" stroke="#FFFFFF" stroke-opacity="${y % 128 ? 0.07 : 0.16}"/>`;
  const [lon, lat] = item.lnglat;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E3A8A"/><stop offset="1" stop-color="#2563EB"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g)"/>${grid}<circle cx="${w - 92}" cy="${h / 2}" r="64" fill="none" stroke="#DBEAFE" stroke-opacity=".5"/><path d="M${w - 92} ${h / 2 - 80}V${h / 2 + 80}M${w - 172} ${h / 2}H${w - 12}" stroke="#DBEAFE" stroke-opacity=".5"/><text x="36" y="${h / 2 - 6}" font-family="Noto Serif SC,Songti SC,serif" font-weight="700" font-size="44" fill="#FFFFFF">${esc(item.name)}</text><text x="38" y="${h / 2 + 30}" font-family="JetBrains Mono,monospace" font-size="15" letter-spacing="2" fill="#BFDBFE">${esc(item.en.toUpperCase())}</text><text x="38" y="${h - 30}" font-family="JetBrains Mono,monospace" font-size="13" fill="#DBEAFE" opacity=".85">${lat.toFixed(4)}°N  ${lon.toFixed(4)}°E · 图片待添加</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

  const kx = 111320 * Math.cos(lat0 * Math.PI / 180), ky = 110574;

  for (let k = 0; k < N; k++) {
    const z0 = (k / N) * 450, z1 = ((k + 1) / N) * 450, t = (z0 + z1) / 900;
    const below = t < 0.62; const f = Math.pow(below ? (0.62 - t) / 0.62 : (t - 0.62) / 0.38, 1.4);

    F.push({ type: 'Feature', properties: { b: z0, h: z1 }, geometry: { type: 'Polygon', coordinates: [ring(rx, ry, (t * 45 * Math.PI) / 180)] } });
  }
  F.push({ type: 'Feature', properties: { b: 450, h: 600 }, geometry: { type: 'Polygon', coordinates: [ring(4.5, 4.5, 0)] } });

    if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
    const ctx = cv.getContext('2d'); ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    const { cp, fpx, yh } = mapHorizon();
    const p = map.getPitch() * D2R, b = map.getBearing() * D2R;
    if (yh <= 2) return;
    const t = this.time(); const c = map.getCenter();
    // camera (pinhole, same as the map)
    const ac = p - Math.PI / 2;
    const F = [Math.cos(ac) * Math.sin(b), Math.cos(ac) * Math.cos(b), Math.sin(ac)];
    const R = [Math.cos(b), -Math.sin(b), 0];
    const Uu = [-Math.sin(b) * Math.sin(ac), -Math.cos(b) * Math.sin(ac), Math.cos(ac)];
    const Lr = localSidereal(t, c.lng) * D2R, ph = c.lat * D2R;
    const sL = Math.sin(Lr), cL = Math.cos(Lr), sp = Math.sin(ph), cpp = Math.cos(ph);
    const E = [-sL, cL, 0], N = [-sp * cL, -sp * sL, cpp], UP = [cpp * cL, cpp * sL, sp];
    const comb = (v) => [v[0] * E[0] + v[1] * N[0] + v[2] * UP[0], v[0] * E[1] + v[1] * N[1] + v[2] * UP[1], v[0] * E[2] + v[1] * N[2] + v[2] * UP[2]];
    const CX = comb(R), CY = comb(Uu), CZ = comb(F);
    const PE = (v) => { const Z = dot(CZ, v); if (Z <= 0.02) return null; return [cp.x + dot(CX, v) / Z * fpx, cp.y - dot(CY, v) / Z * fpx]; };
    const PH = (v) => { const Z = dot(F, v); if (Z <= 0.02) return null; return [cp.x + dot(R, v) / Z * fpx, cp.y - dot(Uu, v) / Z * fpx]; };
    // sky body + city glow, fading into the dark ground just below the horizon
    const g = ctx.createLinearGradient(0, Math.min(0, yh - H), 0, yh + 26);
    g.addColorStop(0, '#01040C'); g.addColorStop(0.55, '#061230'); g.addColorStop(0.86, '#13284F');
    g.addColorStop(0.94, '#3A3150'); g.addColorStop(1, 'rgba(10,18,34,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, yh + 26);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, yh); ctx.clip();
    const D = Sky.D; if (!D) { ctx.restore(); return; }
    // Milky Way, faint under city light
    ctx.globalCompositeOperation = 'lighter';
    for (const m of Sky.mw) { const q = PE(m.v); if (!q || q[1] > yh) continue; const sz = D.mwCell * D2R * fpx * 2.2; ctx.globalAlpha = Math.min(1, m.val * 0.016); ctx.drawImage(Sky.mwSprite, q[0] - sz / 2, q[1] - sz / 2, sz, sz); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
    // constellation lines
    ctx.strokeStyle = 'rgba(96,165,250,.32)'; ctx.lineWidth = 1; ctx.beginPath();
    for (const line of Sky.lines) { let prev = null; for (const v of line) { const q = PE(v); if (q && prev) { ctx.moveTo(prev[0], prev[1]); ctx.lineTo(q[0], q[1]); } prev = q; } }
    ctx.stroke();
    // stars
    const Lm = 4.8; const zf = Math.min(1.8, Math.max(0.9, fpx / 900));
    const sv = Sky.sv, sm = Sky.sm, sc = Sky.sc, n = sm.length;
    for (let i = 0; i < n; i++) {
      const x = sv[i * 3], y = sv[i * 3 + 1], z = sv[i * 3 + 2];
      const Z = CZ[0] * x + CZ[1] * y + CZ[2] * z; if (Z < 0.05) continue;
      const px = cp.x + (CX[0] * x + CX[1] * y + CX[2] * z) / Z * fpx; if (px < -6 || px > W + 6) continue;
      const py = cp.y - (CY[0] * x + CY[1] * y + CY[2] * z) / Z * fpx; if (py < -6 || py > yh) continue;
      const up = UP[0] * x + UP[1] * y + UP[2] * z; if (up < 0.004) continue;
      const m = sm[i] + Math.min(3, 0.28 * (1 / Math.max(up, 0.035) - 1)); if (m > Lm) continue;
      const d = Lm - m; let al = Math.min(1, 0.4 + d * 0.45); if (m < 2.6) al *= 0.82 + 0.18 * Math.sin(ts * 0.007 + i * 1.7);
      const rad = (0.6 + d * 0.38) * zf; ctx.globalAlpha = al;
      if (rad < 1.2) { const q = Math.max(0.65, rad); ctx.fillStyle = rgb(STAR_COL[sc[i]]); ctx.fillRect(px - q, py - q, q * 2, q * 2); }
      else ctx.drawImage(Sky.sprites[sc[i]], px - rad * 3.6, py - rad * 3.6, rad * 7.2, rad * 7.2);
    }
    ctx.globalAlpha = 1;
    // names of bright stars and constellations
    ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.font = '12px "Noto Sans SC","PingFang SC",sans-serif'; ctx.fillStyle = 'rgba(219,234,254,.78)';
    for (const st of Sky.named) { if (st.mag > 1.7) continue; const q = PE(st.v); if (!q || q[1] > yh - 4 || dot(UP, st.v) < 0.03) continue; ctx.fillText(st.zh, q[0] + 7, q[1] - 6); }
    ctx.textAlign = 'center'; ctx.font = '13px "Noto Serif SC","Songti SC",serif'; ctx.fillStyle = 'rgba(147,197,253,.5)';
    for (const k of Sky.cons) { if (k.rank > 2) continue; const q = PE(k.v); if (!q || q[1] > yh - 8 || dot(UP, k.v) < 0.06) continue; ctx.fillText(k.zh, q[0], q[1]); }
    // moon and planets
    if (!this.bodies.length || Math.abs(t - this.bodyT) > 20000) { const o = { t }; Sky.computeBodies.call(o, { lat: c.lat, lon: c.lng, eye: 30 }); this.bodies = o.bodies; this.moonPhase = o.moonPhase; this.bodyT = t.getTime(); }
    const sun = this.bodies.find((x) => x.id === 'Sun');
    ctx.textAlign = 'left'; ctx.font = '12.5px "Noto Sans SC",sans-serif';
    for (const bd of this.bodies) {
      if (bd.id === 'Sun' || bd.alt < 0.5) continue; const q = PH(bd.v); if (!q || q[1] > yh) continue;
      if (bd.id === 'Moon') {
        const r = Math.max(7, 0.26 * D2R * fpx);
        const sv2 = sun ? sun.v : [0, 0, -1]; const al2 = dot(sv2, bd.v); let pr = [sv2[0] - al2 * bd.v[0], sv2[1] - al2 * bd.v[1], sv2[2] - al2 * bd.v[2]]; const pl = Math.hypot(...pr) || 1; pr = pr.map((x) => x / pl);
        const qq = PH([bd.v[0] * Math.cos(2 * D2R) + pr[0] * Math.sin(2 * D2R), bd.v[1] * Math.cos(2 * D2R) + pr[1] * Math.sin(2 * D2R), bd.v[2] * Math.cos(2 * D2R) + pr[2] * Math.sin(2 * D2R)]);
        const gl = ctx.createRadialGradient(q[0], q[1], r, q[0], q[1], r * 5); gl.addColorStop(0, 'rgba(253,246,216,.22)'); gl.addColorStop(1, 'rgba(253,246,216,0)'); ctx.fillStyle = gl; ctx.beginPath(); ctx.arc(q[0], q[1], r * 5, 0, Math.PI * 2); ctx.fill();
        drawMoon(ctx, q[0], q[1], r, this.moonPhase, qq ? Math.atan2(qq[1] - q[1], qq[0] - q[0]) : 0);
        ctx.fillStyle = 'rgba(253,246,216,.9)'; ctx.fillText('月亮', q[0] + r + 6, q[1]);
      } else if (bd.mag < 5) {
        const rad = Math.min(4, 1.2 + (4.8 - bd.mag) * 0.38) * zf;
        ctx.drawImage(Sky.sprites[bd.id === 'Mars' ? 5 : 3], q[0] - rad * 3.6, q[1] - rad * 3.6, rad * 7.2, rad * 7.2);
        ctx.fillStyle = bd.col; ctx.fillText(bd.zh, q[0] + rad + 7, q[1]);
      }
    }
    ctx.restore();
    // cardinal hints along the horizon
    ctx.textAlign = 'center'; ctx.textBaseline = 'bottom'; ctx.font = '600 13px "Noto Sans SC",sans-serif';
    for (const [nm, az, main] of DIRS) { if (!main) continue; const q = PH(vHz(0.8, az)); if (!q || q[0] < 0 || q[0] > W) continue; ctx.fillStyle = nm === '北' ? '#60A5FA' : 'rgba(219,234,254,.8)'; ctx.fillText(nm, q[0], yh - 4); }
  },
};

const LookUp = {
  acc: 0, p: 0, busy: false, drag: null, DEAD: 60, TH: 230,   // px pulled past the top: nothing shows until DEAD, sky opens at TH
  atTop() { return !!map && map.getPitch() >= map.getMaxPitch() - 0.6; },
  init() {
    const el = map.getCanvasContainer();
    $('#lookHow').textContent = matchMedia('(pointer: coarse)').matches ? '双指继续往上推' : '按住右键继续往上拖';
    el.addEventListener('mousedown', (e) => { if (e.button === 2 || (e.button === 0 && e.ctrlKey)) this.drag = { y: e.clientY }; });
    window.addEventListener('mousemove', (e) => { if (!this.drag || this.drag.touch) return; const dy = this.drag.y - e.clientY; this.drag.y = e.clientY; this.push(dy); });
    window.addEventListener('mouseup', () => { if (this.drag && !this.drag.touch) { this.drag = null; this.release(); } });
    const mid = (t) => (t[0].clientY + t[1].clientY) / 2;
    el.addEventListener('touchstart', (e) => { if (e.touches.length === 2) this.drag = { y: mid(e.touches), touch: true }; else if (this.drag) { this.drag = null; this.release(); } }, { passive: true });
    el.addEventListener('touchmove', (e) => { if (!this.drag || !this.drag.touch || e.touches.length !== 2) return; const y = mid(e.touches); const dy = this.drag.y - y; this.drag.y = y; this.push(dy * 1.4); }, { passive: true });
    const tend = (e) => { if (this.drag && this.drag.touch && e.touches.length < 2) { this.drag = null; this.release(); } };
    el.addEventListener('touchend', tend, { passive: true }); el.addEventListener('touchcancel', tend, { passive: true });
    el.addEventListener('keydown', (e) => { if (e.shiftKey && e.key === 'ArrowUp' && this.atTop()) { this.push(60); clearTimeout(this._kt); this._kt = setTimeout(() => this.release(), 900); } });
    map.on('move', () => { this.place(); DaySky.queue(); });
    map.on('resize', () => DaySky.queue()); DaySky.queue();
    map.on('pitchend', () => this.place());
    $('#lookHint').addEventListener('click', () => this.go());
  },
  push(dy) {
    if (this.busy) return;
    if (!this.atTop()) { if (this.acc) this.set(0); return; }
    if (map.getPitch() >= 80) SkyDome.ensureData();
    this.set(Math.max(0, this.acc + dy));
    if (this.acc >= this.TH) this.go();
  },
  set(a) { this.acc = a; this.p = Math.min(1, Math.max(0, (a - this.DEAD) / (this.TH - this.DEAD))); if (this.p > 0.002) SkyDome.start(); this.place(); },
  release() {
    if (this.busy || !this.acc) return;
    const a0 = this.acc, t0 = performance.now();
    const step = (now) => { if (this.busy || this.drag) return; const k = Math.min(1, (now - t0) / 360); this.set(a0 * (1 - k * (2 - k))); if (k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  },
  // the hint floats just above the skyline, only once the map is tilted all the way up
  place() {
    const h = $('#lookHint'); if (!map || !state.ready) return;
    const pitch = map.getPitch();
    if (pitch >= 76) SkyDome.ensureData();
    const show = !this.busy && $('#sky').hidden && pitch >= 82 && this.acc > this.DEAD;
    h.classList.toggle('show', show);
    if (!show) return;
    const { cp, yh } = mapHorizon();
    h.style.left = `${Math.round(cp.x)}px`; h.style.top = `${Math.round(Math.max(118, yh - 18))}px`;
    h.querySelector('.prog').style.strokeDashoffset = (75.4 * (1 - this.p)).toFixed(1);
    h.classList.toggle('dark', this.p > 0.3);
  },
  async go() {
    if (this.busy || !map || !$('#sky').hidden) return;
    this.busy = true; this.drag = null; closePops(); this.place();
    if (!(await SkyDome.ensureData())) { this.busy = false; this.set(0); toast('星空数据没能加载，请刷新重试。'); return; }
    // finish the pull, then let the city sink while the sky rises
    const p0 = this.p, t0 = performance.now();
    SkyDome.start();
    await new Promise((res) => { const step = (now) => { const k = Math.min(1, (now - t0) / 280); this.p = p0 + (1 - p0) * k; if (k < 1) requestAnimationFrame(step); else res(); }; requestAnimationFrame(step); });
    document.body.classList.add('lifted');
    const c = map.getCenter();
    Sky.open({ az: map.getBearing(), fromMap: true, center: [c.lng, c.lat] });
    setTimeout(() => { this.acc = 0; this.p = 0; SkyDome.stop(); this.busy = false; }, reduceMotion ? 0 : 1300);
  },
  back(az) {
    this.acc = 0; this.p = 0; this.drag = null;
    if (map) map.jumpTo({ bearing: ((az + 540) % 360) - 180, pitch: map.getMaxPitch() });
    document.body.classList.remove('lifted');
    if (map) setTimeout(() => map.easeTo({ pitch: 66, duration: reduceMotion ? 0 : 1500, essential: true }), reduceMotion ? 0 : 650);
  },
};

/* ===================================================================== controls */
$('#zIn').addEventListener('click', () => map && map.zoomIn());
$('#zOut').addEventListener('click', () => map && map.zoomOut());
$('#t3d').addEventListener('click', () => {
  if (!map) return; state.is3d = map.getPitch() < 5;
  map.easeTo({ pitch: state.is3d ? 55 : 0, duration: 700 });
});
$('#zHome').addEventListener('click', () => map && map.flyTo({ ...HOME(), essential: true }));
$('#zSky').addEventListener('click', () => {
  if (!map) return;
  if (LookUp.atTop()) { LookUp.go(); return; }
  map.once('moveend', () => { if (LookUp.atTop()) setTimeout(() => LookUp.go(), 250); });   // listen first: a 0 ms ease ends synchronously
  map.easeTo({ pitch: map.getMaxPitch(), zoom: Math.max(map.getZoom(), 15.2), duration: reduceMotion ? 0 : 1500, essential: true });
});
$('#compass').addEventListener('click', () => map && map.easeTo({ bearing: 0, duration: 600 }));
$('#avatarBtn').addEventListener('click', openDrawer);
$('#scrim').addEventListener('click', closeDrawer);
$('#profileDrawer').addEventListener('click', (e) => { if (e.target.closest('[data-close-drawer]')) closeDrawer(); });
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!$('#sky').hidden) Sky.close();
  else if ($('#profileDrawer').classList.contains('open')) closeDrawer();
  else if (!$('#detail').hidden) closeDetail();
  else closePops();
});

/* ===================================================================== boot */
renderProfile();
renderNav();
renderCities();
tickClock(); setInterval(tickClock, 1000);
if (Auto.on()) { Auto.grace = Date.now() + 6000; Auto.kick(6000); }
loadWeather();
initMap();
})();
</script>
